 const C={
 dex:()=>({k:r?'Держатель Amber · пара WPOL/Amber':'An Amber holder · the WPOL/Amber pair',h:t('nDex'),b:r?
 `<p>Пул ликвидности на DEX: здесь Amber меняют на POL и обратно. Это самый крупный держатель Amber вне мёртвого адреса. Потоки к пулу и от него — обмены и переводы игроков.</p>`:

 poly:()=>({k:r?'Ткань пространства · сеть':'Spacetime fabric · network',h:'Polygon',b:r?`<p>Фиолетовая сетка под системой — сеть Polygon PoS, ткань пространства, на которой стоит вся экономика Amber. Под массой экосистемы она слегка прогибается, как резиновое полотно в моделях гравитации. Самые глубокие впадины — под Камнем души и чёрной дырой.</p><p>Токен, гномы, боевой контракт, стейкинг и Банк — лишь малая часть этой сети.</p>`:`<p>The purple grid beneath the system is the Polygon PoS network, the spacetime fabric the whole Amber economy rests on. It sags gently under the ecosystem’s mass, like the rubber sheet in gravity diagrams. The deepest wells are under the Soul Stone and the black hole.</p><p>The token, the gnomes, the battle contract, staking and the Bank are only a small part of this network.</p>`,
 n:[[r?'Сеть':'Network','Polygon PoS · chainId 137'],[r?'Газ':'Gas','POL'],[r?'Сервисный сбор матча':'Match service fee',r?'0,01 POL с игрока':'0.01 POL per player']],x:`<p class="note"><a href="https://polygonscan.com" target="_blank" rel="noopener">Polygonscan ↗</a></p>`}),
 link:()=>{const A=(a,l)=>`<a href="${scanAddr(a)}" target="_blank" rel="noopener">${l||short(a)} ↗</a>`;const V=typeof BATV!=='undefined'?BATV:{};return {k:r?'Кольцо туманности · автоматизация':'Nebula ring · automation',h:'Chainlink',b:r?
 `<p>Синее туманное кольцо вокруг системы — Chainlink, сеть децентрализованных оракулов и автоматизации, в которой работает и наша экосистема.</p><p>Проверенная роль в Amber: Chainlink Automation обслуживает контракт стейкинга — узлы Chainlink сами вызывают его по условию (апкип). Средства на апкип вносит боевой контракт: сервисный сбор матчей (0,01 POL с игрока) копится, при раздаче долей пула меняется на LINK через DEX, переводится в формат ERC-677 через PegSwap и вносится в реестр Automation.</p><p>Победителя матча Chainlink не выбирает: функцию endGame вызывает адрес оператора игры, и контракт сразу выплачивает победителю 90% пула.</p>`:
 `<p>The blue nebula ring around the system is Chainlink, the decentralised oracle and automation network our ecosystem also runs inside.</p><p>Verified role in Amber: Chainlink Automation services the staking contract — Chainlink nodes call it on a condition (an upkeep). The battle contract funds that upkeep: the match service fee (0.01 POL per player) accrues, and when the pool shares are distributed it is swapped to LINK on a DEX, converted to ERC-677 via PegSwap and added to the Automation registry.</p><p>Chainlink does not pick match winners: endGame is called by the game operator address, and the contract pays the winner 90% of the pool at once.</p>`,
 n:[[r?'Реестр Automation':'Automation registry',V.reg?A(V.reg):'—'],[r?'Цель апкипа':'Upkeep target',(r?'Стейкинг ':'Staking ')+((CFG.contracts.staking||{}).address?A(CFG.contracts.staking.address):'')],[r?'Пополнений из боевого контракта':'Top-ups from the battle contract',r?'3 921 · ≈0,79 LINK':'3,921 · ≈0.79 LINK'],[r?'Вызовов узлами Chainlink':'Calls by Chainlink nodes','29'],[r?'Оператор матчей (endGame)':'Match operator (endGame)',V.op?A(V.op):'—'],['LINK · ERC-677',V.link677?A(V.link677):'—'],['PegSwap',V.peg?A(V.peg):'—'],[r?'VRF и ценовые фиды':'VRF and price feeds',r?'не используются':'not used']],
 x:`<p class="note">${r?'Проверено по исходному коду контрактов (Sourcify) и событиям FundsAdded и UpkeepPerformed в блокчейне, 24.10.2026. Кольца — фон: импульсов и связей на схеме нет.':'Verified against the contracts’ source code (Sourcify) and the on-chain FundsAdded and UpkeepPerformed events, 24 Oct 2026. The rings are a backdrop: there are no pulses or links on the map.'}</p>`}},
 tw:()=>{const c=CA('castleNft');return {k:r?'Кольцо туманности · фабрика обликов':'Nebula ring · skin factory',h:'thirdweb',b:r?
 `<p>Розово-фиолетовое туманное кольцо — thirdweb, наш партнёр по инфраструктуре блокчейна: автоматизация и развёртывание смарт-контрактов.</p><p>Это фабрика обликов: раз в 1–2 месяца из кольца выходит волна новых NFT замков — ограниченный тираж косметики (облик замка, дизайн колоды, иконки). NFT улетают в кошельки игроков; держатели владеют ими у себя в кошельке и сами решают, что с ними делать.</p><p>Каждая коллекция — отдельный tokenId одного контракта ERC-1155 с фиксированным лимитом.</p>`:
 `<p>The pink-violet nebula ring is thirdweb, our blockchain infrastructure partner: automation and smart contract deployment.</p><p>It is the skin factory: every 1–2 months a wave of new castle NFTs leaves the ring, a limited run of cosmetics (castle skin, deck design, icons). The NFTs fly to player wallets; holders own them in their own wallets and decide what to do with them.</p><p>Each collection is a separate token id of one ERC-1155 contract with a fixed limit.</p>`,

 shield:()=>({k:r?'Эфирный щит экосистемы':'Ether shield of the ecosystem',h:'Electrum Decisions',b:r?
 `<p>Тонкий эфирный щит — студия Electrum Decisions. Он держит всю экосистему вместе: камень Amber, боевой контракт, стейкинг, Банк Студии, гномов, шахту и кошельки игроков.</p><p>Внутри щита — всё, что создаёт и поддерживает студия. Снаружи — внешние площадки и кольцо партнёра thirdweb; кольцо Chainlink проходит через щит.</p>`:
 `<p>The thin ether shield is the Electrum Decisions studio. It holds the whole ecosystem together: the Amber stone, the battle contract, staking, the Studio Bank, the gnomes, the mine and the player wallets.</p><p>Inside the shield is everything the studio builds and runs. Outside are the external marketplaces and the thirdweb partner ring; the Chainlink ring passes through the shield.</p>`,

 `<p>There is no in-game market and there never will be: NFTs are bought and sold outside the game, on external marketplaces.</p><p>On resales of the future castle NFTs (cosmetics) the studio gets a 1% royalty in POL/USDC, paid automatically by the marketplaces into the Studio Bank. It is extra crypto income on top of the model, so the model’s numbers leave it out. Gnomes carry no royalty.</p>`,

 contract:()=>({k:r?'Камень души · токен в сети Polygon':'The Soul Stone · a token on Polygon',h:t('nContract'),b:r?
 `<p>Amber — центр всей экономики. Каждый взнос в пул матча, каждая награда, сжигание и майнинг — это движение Amber между кошельками и контрактами вокруг Камня души. Гномы добывают его, а золотой эфир внутри камня — это энергия, которую черпают игроки.</p><p>Новых Amber не выпускается: все 10 млрд уже выпущены. Дальше предложение может только уменьшаться.</p>`:
 `<p>Amber is the centre of the whole economy. Every match pool contribution, reward, burn and mining payout is Amber moving between the wallets and contracts around the Soul Stone. The gnomes mine it, and the golden ether inside the stone is the energy players draw on.</p><p>No new Amber is issued: all 10 bn already exist. From here supply can only go down.</p>`,

 x:supplyBar()+`<p class="note">${r?'«Сожжено» — по финансовой модели, с учётом первого шага плана. Сколько Amber лежит на мёртвом адресе прямо сейчас, показывает режим «Блокчейн».':'“Burned” is per the financial model, including the first step of the plan. Blockchain mode shows how much Amber sits at the dead address right now.'}</p>`}),
 pool:()=>({k:r?'1 на 1 · боевой контракт':'1v1 · the battle contract',h:t('nPool'),b:r?
 `<p>Два игрока вносят в пул одинаковую сумму, так что пул всегда равен двум взносам. Пока идёт матч, Amber лежат в боевом контракте, и ни у одной из сторон нет к ним доступа.</p><p>Студия в матче не участвует и против игроков не играет. Она получает фиксированный 1% с пула, кто бы ни победил.</p>`:

 `<p>6% каждого пула боевой контракт отправляет на мёртвый адрес 0x…dEaD. Это чёрная дыра: ключа к адресу нет ни у кого, и Amber оттуда не возвращаются никогда. Диск растёт и светится ярче с каждым сжиганием.</p><p>Сюда же падает Amber, купленный на 80% от минта гномов. Сколько Amber при этом сгорит, зависит от рынка, поэтому эту часть мы показываем в долларах и в Amber не прогнозируем.</p>`:

function simHistory(i){
 const r=rng(i*2654435761+99),ev=[];const j=SET.join[i];if(!isFinite(j))return {ev:[],sum:null};
 let bal=SET.bal0[i];ev.push({t:j,ty:'join',a:bal});
 const days=Math.max(0,(Math.min(0,S.simT)-j)/86400),act=SET.act[i];
 const nm=Math.round(days*act*MATCH_PER_PLAYER_DAY);
 for(let k=0;k<nm;k++){const tt=j+r()*(0-j),e=Math.min(sampleEntry(r),Math.max(10,Math.round(bal*.2)));const o=Math.floor(r()*N0);ev.push({t:tt,ty:'contrib',a:e,o});
  if(r()<.5)ev.push({t:tt+60,ty:'win',a:2*e*M.win,o,s:e});else ev.push({t:tt+60,ty:'loss',a:0,o,s:e})}
 if(r()<.35){const tt=j+r()*(0-j)*.5,a=Math.round(bal*(.1+r()*.3));ev.push({t:tt,ty:'stake',a});for(let q=tt+7*86400;q<0;q+=7*86400)ev.push({t:q,ty:'stakeR',a:Math.round(a*.004*(.5+r()))})}
 if(SET.gn[i]&&SET.gids.has(i)){const ids=SET.gids.get(i);const t0=SET.gAcq[i];ids.forEach((id,q)=>{const tt=t0+q*600;if(tt<=0)ev.push({t:tt,ty:'gnome',a:0,id})})}
 if(r()<.08){const tt=j+r()*(0-j);ev.push({t:tt,ty:'tEntry',a:M.tEntry});if(r()<.1)ev.push({t:tt+3600,ty:'tPrize',a:M.tPool*M.tP[3],pl:4})}
 ev.sort((a,b)=>a.t-b.t);
 for(const x of (LIVE_EV.get(i)||[]))ev.push({t:x[0],ty:x[1],a:x[2],o:x[1]==='gnome'||x[1]==='mine'||x[1]==='tPrize'?undefined:x[3],id:x[1]==='gnome'?x[3]:undefined});
 return {ev,sum:sumHist(ev,i)}}
function sumHist(ev,i){const s={joined:ev.length?ev[0].t:null,m:0,w:0,c:0,rw:0,st:0,tx:ev.length,bal:0};
 for(const e of ev){if(e.ty==='contrib'||e.ty==='tEntry'){s.m+=e.ty==='contrib'?1:0;s.c+=e.a;s.bal-=e.a}
  else if(e.ty==='win'||e.ty==='tPrize'||e.ty==='stakeR'||e.ty==='mine'){if(e.ty==='win')s.w++;s.rw+=e.a;s.bal+=e.a}
  else if(e.ty==='stake'){s.st+=e.a;s.bal-=e.a}else if(e.ty==='join'||e.ty==='in'||e.ty==='mintIn'){s.bal+=e.a}else if(e.ty==='out'||e.ty==='burn'){s.bal-=e.a}}
 if(SET.kind==='chain')s.bal=SET.bal[i];else s.bal=Math.max(0,s.bal);
 s.g=SET.gn[i];s.ids=(SET.gids.get(i)||[]).slice().sort((a,b)=>a-b);return s}

/* --- keccak-256 (for event topics) --- */
const KRC=['0x1','0x8082','0x800000000000808a','0x8000000080008000','0x808b','0x80000001','0x8000000080008081','0x8000000000008009','0x8a','0x88','0x80008009','0x8000000a','0x8000808b','0x800000000000008b','0x8000000000008089','0x8000000000008003','0x8000000000008002','0x8000000000000080','0x800a','0x800000008000000a','0x8000000080008081','0x8000000000008080','0x80000001','0x8000000080008008'].map(BigInt);
const KROT=[[0,36,3,41,18],[1,44,10,45,2],[62,6,43,15,61],[28,55,25,21,56],[27,20,39,8,14]];
function keccak256(str){const M64=(1n<<64n)-1n,rot=(v,n)=>n?((v<<BigInt(n))|(v>>BigInt(64-n)))&M64:v;
 const by=new TextEncoder().encode(str),rate=136,len=by.length,pad=rate-(len%rate),m=new Uint8Array(len+pad);m.set(by);m[len]^=1;m[m.length-1]^=0x80;
 const s=new Array(25).fill(0n);
 for(let off=0;off<m.length;off+=rate){for(let i=0;i<rate/8;i++){let v=0n;for(let b=7;b>=0;b--)v=(v<<8n)|BigInt(m[off+i*8+b]);s[i]^=v}
  for(let r=0;r<24;r++){const C=[0,1,2,3,4].map(x=>s[x]^s[x+5]^s[x+10]^s[x+15]^s[x+20]);
   for(let i=0;i<25;i++)s[i]^=C[(i%5+4)%5]^rot(C[(i%5+1)%5],1);
   const B=new Array(25);for(let x=0;x<5;x++)for(let y=0;y<5;y++)B[y+5*((2*x+3*y)%5)]=rot(s[x+5*y],KROT[x][y]);
   for(let x=0;x<5;x++)for(let y=0;y<5;y++)s[x+5*y]=B[x+5*y]^((~B[(x+1)%5+5*y])&M64&B[(x+2)%5+5*y]);s[0]^=KRC[r]}}
 let h='0x';for(let i=0;i<4;i++){let v=s[i];for(let b=0;b<8;b++){h+=Number(v&255n).toString(16).padStart(2,'0');v>>=8n}}return h}
// parse 'Name(type indexed name,…)' → {name,canon,topic,params:[{type,indexed,name}]}
function parseSig(sig){const m=/^\s*(\w+)\s*\(([^)]*)\)/.exec(sig||'');if(!m)return null;
 const params=m[2].trim()?m[2].split(',').map(x=>{const w=x.trim().split(/\s+/);let type=w[0];if(type==='uint')type='uint256';if(type==='int')type='int256';return {type,indexed:w.includes('indexed'),name:w.length>1&&w[w.length-1]!=='indexed'?w[w.length-1]:''}}):[];
 const canon=m[1]+'('+params.map(p=>p.type).join(',')+')';return {name:m[1],canon,topic:keccak256(canon),params}}
const TOPIC_TRANSFER=keccak256('Transfer(address,address,uint256)');

const toAmb=h=>{if(!h||h==='0x')return 0;try{const b=BigInt(h);return Number(b/10n**12n)/1e6}catch(e){return 0}};
function decStr(h){try{const b=h.slice(2);const off=parseInt(b.slice(0,64),16)*2;const len=parseInt(b.slice(off,off+64),16);const hexs=b.slice(off+64,off+64+len*2);
 const u=new Uint8Array(len);for(let i=0;i<len;i++)u[i]=parseInt(hexs.substr(i*2,2),16);return new TextDecoder().decode(u)}catch(e){return ''}}

/* --- RPC with fallbacks + backoff --- */
const RPCS=CFG.network.rpcs.map(r=>Object.assign({dead:0},r));
async function rpcOne(r,method,params,ms=25000){const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),ms);
 try{const res=await fetch(r.url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:ac.signal});
  if(!res.ok)throw new Error('http '+res.status);const j=await res.json();if(j.error){const e=new Error(j.error.message||'rpc error');e.rpc=true;throw e}return j.result}finally{clearTimeout(tm)}}
async function rpc(method,params,opt={}){let last;const list=RPCS.filter(r=>!opt.archive||r.archive);
 for(let pass=0;pass<2;pass++){for(const r of list){if(pass===0&&r.dead>Date.now())continue;
  try{const v=await rpcOne(r,method,params);CH.rpc=r.url;return v}catch(e){last=e;if(e.rpc&&/revert|nonexistent|invalid opcode/i.test(e.message))throw e;r.dead=Date.now()+20000}}
  await sleep(600)}
 throw last||new Error('no rpc')}
const ethCall=(to,data,tag='latest')=>rpc('eth_call',[{to,data},tag]);
// adaptive eth_getLogs scan: grows span on success, divides by 3 on error, backs off, then switches node
async function scanLogs(filter,from,to,onChunk,onProg){
 const list=RPCS.filter(r=>r.archive).sort((a,b)=>b.maxRange-a.maxRange);let ri=0,b=from,span=Math.min(500000,list[0].maxRange),errs=0,req=0;
 while(b<=to){const r=list[ri];const e=Math.min(to,b+Math.min(span,r.maxRange)-1);
  try{const logs=await rpcOne(r,'eth_getLogs',[Object.assign({},filter,{fromBlock:hx(b),toBlock:hx(e)})],40000);req++;CH.rpc=r.url;
   onChunk(logs);b=e+1;errs=0;if(logs.length<8000)span=Math.min(span*2,r.maxRange);onProg&&onProg(b,to)}
  catch(err){errs++;span=Math.max(1000,Math.floor(span/3));await sleep(Math.min(5000,250*2**Math.min(errs,4)));
   if(errs>=7){ri++;errs=0;if(ri>=list.length)throw err;span=Math.min(span,list[ri].maxRange)}}}
 return req}

/* --- IndexedDB cache --- */
const IDB={db:null,ok:true};
function idbOpen(){return new Promise(res=>{try{const q=indexedDB.open('ed-amber-v2',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{IDB.db=q.result;res(IDB.db)};q.onerror=()=>{IDB.ok=false;res(null)}}catch(e){IDB.ok=false;res(null)}})}
async function idbGet(k){const db=IDB.db||await idbOpen();if(!db)return null;return new Promise(res=>{try{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})}
async function idbPut(k,v){const db=IDB.db||await idbOpen();if(!db)return;return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
async function idbDel(k){const db=IDB.db||await idbOpen();if(!db)return;return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res(true)}catch(e){res(false)}})}

/* --- chain state --- */
const CH={state:'idle',rpc:'',latest:0,to:0,lastKey:-1,addrs:[],aIdx:new Map(),blk:[],fr:[],tt:[],val:[],tx:[],deadCum:[],balA:[],first:[],
 supply:null,dead:null,bals:{},anchors:[],partial:false,updAt:0,
 bat:{ev:[],to:0,n:{},sigs:[]},gnm:{to:0,own:new Map(),log:[],total:null,inC:0,dead:0,hands:0},replay:[],repT:0,polling:false,pollT:0,dirty:false};
function ai(a){let k=CH.aIdx.get(a);if(k===undefined){k=CH.addrs.length;CH.addrs.push(a);CH.aIdx.set(a,k);CH.balA.push(0);CH.first.push(-1)}return k}
const SPECIAL=()=>{const m={};m[ZERO]='contract';m[CA('amber')]='contract';m[DEAD]='burn';
 for(const [c,k] of [['battle','pool'],['bank','bank'],['staking','staking'],['tournament','tour'],['gnomeNft','gnome'],['mining','reserve'],['dexPair','dex']]){const a=CA(c);if(a)m[a]=k}return m};
let SPEC=SPECIAL();
function ingestAmber(logs,live){let n=0;
 for(const l of logs){if(l.topics.length!==3||l.topics[0]!==TOPIC_TRANSFER)continue;const b=parseInt(l.blockNumber,16),li=parseInt(l.logIndex,16),key=b*1e5+li;if(key<=CH.lastKey)continue;CH.lastKey=key;
  const f=ai('0x'+l.topics[1].slice(26)),t2=ai('0x'+l.topics[2].slice(26)),v=toAmb(l.data),q=CH.blk.length;
  CH.blk.push(b);CH.fr.push(f);CH.tt.push(t2);CH.val.push(v);CH.tx.push(l.transactionHash);
  CH.balA[f]-=v;CH.balA[t2]+=v;if(CH.first[f]<0)CH.first[f]=q;if(CH.first[t2]<0)CH.first[t2]=q;
  CH.deadCum.push((q?CH.deadCum[q-1]:0)+(CH.addrs[t2]===DEAD?v:0));n++;if(live)CH.replay.push(q)}
 return n}
function ingestBattle(logs){const sigs=CH.bat.sigs;for(const l of logs){const s=sigs.find(x=>x.topic===l.topics[0]);if(!s)continue;
  const args={};let ti=1,di=0;const data=(l.data||'0x').slice(2);
  for(const p of s.params){let raw;if(p.indexed)raw=l.topics[ti++];else{raw='0x'+data.slice(di*64,di*64+64);di++}
   if(!raw){args[p.name]=null;continue}
   if(p.type==='address')args[p.name]='0x'+raw.slice(-40);else if(/^u?int/.test(p.type))args[p.name]=/id$/i.test(p.name)?parseInt(raw,16):toAmb(raw);else args[p.name]=raw}
  CH.bat.ev.push({b:parseInt(l.blockNumber,16),n:s.name,a:args,tx:l.transactionHash});CH.bat.n[s.name]=(CH.bat.n[s.name]||0)+1}}
function ingestGnome(logs){for(const l of logs){if(l.topics[0]!==TOPIC_TRANSFER||l.topics.length!==4)continue;const f='0x'+l.topics[1].slice(26),to='0x'+l.topics[2].slice(26),id=parseInt(l.topics[3],16);
  CH.gnm.own.set(id,to);CH.gnm.log.push({b:parseInt(l.blockNumber,16),f,to,id,tx:l.transactionHash})}}

/* --- block time anchors --- */
async function loadAnchors(){const s=[CFG.contracts.amber.fromBlock,CH.latest];for(let k=1;k<10;k++)s.push(Math.round(s[0]+(CH.latest-s[0])*k/10));
 for(const c of ['battle','gnomeNft'])if(CFG.contracts[c]&&CFG.contracts[c].fromBlock)s.push(CFG.contracts[c].fromBlock);
 const have=new Set(CH.anchors.map(a=>a[0]));const todo=[...new Set(s)].filter(b=>!have.has(b));
 await Promise.all(todo.map(async b=>{try{const r=await rpc('eth_getBlockByNumber',[hx(b),false]);if(r)CH.anchors.push([b,parseInt(r.timestamp,16)*1000])}catch(e){}}));
 CH.anchors.sort((a,b)=>a[0]-b[0])}
function blockTime(b){const A=CH.anchors;if(!A.length)return Date.now()-(CH.latest-b)*2100;
 if(b<=A[0][0])return A[0][1]-(A[0][0]-b)*2100;const L2=A[A.length-1];if(b>=L2[0])return L2[1]+(b-L2[0])*2100;
 let lo=0,hi=A.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(A[m][0]<=b)lo=m;else hi=m}const p=A[lo],q=A[hi];return p[1]+(q[1]-p[1])*(b-p[0])/(q[0]-p[0])}

/* --- balances via eth_call --- */
async function balOf(token,who){try{return toAmb(await ethCall(token,'0x70a08231'+pad32(who)))}catch(e){return null}}
async function readBalances(){const am=CA('amber');try{CH.supply=toAmb(await ethCall(am,'0x18160ddd'))}catch(e){}
 const r=await Promise.all(['dead','dexPair','staking','bank','battle','tournament','mining'].map(async c=>[c,CA(c)?await balOf(am,CA(c)):null]));
 for(const [c,v] of r)CH.bals[c]=v;CH.dead=CH.bals.dead;CH.updAt=Date.now()}
async function readGnome(){const g=CA('gnomeNft');if(!g){GN.known=false;return}
 try{CH.gnm.total=parseInt(await ethCall(g,'0x18160ddd'),16)}catch(e){CH.gnm.total=null}
 const holder=lc(CFG.contracts.gnomeNft.mintHolder)||g;
 try{CH.gnm.inC=parseInt(await ethCall(g,'0x70a08231'+pad32(holder)),16)}catch(e){CH.gnm.inC=0}
 try{CH.gnm.dead=parseInt(await ethCall(g,'0x70a08231'+pad32(DEAD)),16)}catch(e){CH.gnm.dead=0}
 const minted=CH.gnm.total!=null?CH.gnm.total:CH.gnm.own.size,cap=Math.min(9999,CFG.contracts.gnomeNft.maxSupply||9999);
 CH.gnm.hands=Math.max(0,minted-CH.gnm.inC-CH.gnm.dead);CH.gnm.minted=Math.min(cap,minted);CH.gnm.left=Math.max(0,cap-CH.gnm.minted);GN.known=true}
// tokenURI → metadata → image (ipfs via public gateways)
const GMETA=new Map();
const ipfsUrls=u=>{if(!u)return [];if(u.startsWith('ipfs://')){const p=u.slice(7).replace(/^ipfs\//,'');return (CFG.ipfs||['https://ipfs.io/ipfs/']).map(g=>g+p)}return [u]};
async function fetchAny(urls,json){for(const u of urls){try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),12000);const r=await fetch(u,{signal:ac.signal});clearTimeout(tm);if(r.ok)return json?await r.json():u}catch(e){}}return null}
/* IPFS: at most 2 metadata requests in flight, gateways rotated per token (public gateways answer bursts with 429 without CORS headers) */
const IPQ={n:0,q:[]};function ipfsLim(f){return new Promise(res=>{const go=()=>{IPQ.n++;f().then(res,()=>res(null)).finally(()=>{IPQ.n--;const nx=IPQ.q.shift();if(nx)setTimeout(nx,180)})};IPQ.n<2?go():IPQ.q.push(go)})}
function gnomeMeta(id){if(GMETA.has(id))return GMETA.get(id);const g=CA('gnomeNft');
 const p=(async()=>{if(!g)return null;let uri='';try{uri=decStr(await ethCall(g,'0xc87b56dd'+id.toString(16).padStart(64,'0')))}catch(e){return null}
  const us=ipfsUrls(uri),k=us.length>1?id%Math.min(2,us.length):0;const ord=us.slice(k).concat(us.slice(0,k));let j=await ipfsLim(()=>fetchAny(ord,true));if(!j){await new Promise(r=>setTimeout(r,2500));j=await ipfsLim(()=>fetchAny(ord,true))}if(!j)return {name:'#'+id,img:null};return {name:j.name||('#'+id),img:ipfsUrls(j.image||'')}})();GMETA.set(id,p);return p}
const osUrl=id=>(CFG.contracts.gnomeNft.opensea||('https://opensea.io/assets/matic/'+CA('gnomeNft')+'/'))+id;
function gnomeThumbs(ids,el){if(!el)return;if(!ids.length){el.innerHTML='';return}

  `<div class="sm" style="flex-basis:100%"><a href="${CFG.contracts.gnomeNft.collection||'https://opensea.io/collection/amber-digger'}" target="_blank" rel="noopener">${t('gOpen')}</a></div>`;
 el.querySelectorAll('.gth').forEach(a=>{const id=+a.dataset.id;gnomeMeta(id).then(async m=>{const i=a.querySelector('i');if(!m||!m.img||!m.img.length){i.textContent='🜨';return}
  for(const u of m.img){const ok=await new Promise(res=>{const im=new Image();im.onload=()=>{i.replaceWith(im);res(true)};im.onerror=()=>res(false);im.alt=m.name;im.src=u});if(ok)break}})})}

 else if(S.demo)banner(`${CH.state==='fail'?t('bnFail'):t('bnDemo')} <button id="bnBack">${CH.state==='fail'?t('bnRetry'):t('srcChain')}</button>`,CH.state==='fail');else banner(null);

/* --- full load --- */
async function loadChain(force){if(CH.state==='loading')return;CH.state='loading';bannerRefresh();
 try{CH.latest=parseInt(await rpc('eth_blockNumber',[]),16);
  const key=CACHE_KEY();let cached=force?null:await idbGet(key);
  if(force){await idbDel(key);resetCH()}
  if(cached&&cached.to&&!CH.blk.length){restoreCH(cached);prog(t('progCache',{n:fmt(CH.blk.length)}),.9)}
  await readBalances();
  // Amber transfers
  const from=CH.to?CH.to+1:CFG.contracts.amber.fromBlock,span0=CH.latest-from+1;
  if(from<=CH.latest)await scanLogs({address:CFG.contracts.amber.address,topics:[TOPIC_TRANSFER]},from,CH.latest,l=>ingestAmber(l,false),(b,e)=>prog(t('progScan',{b:fmt(b),e:fmt(e),n:fmt(CH.blk.length)}),(b-from)/Math.max(1,span0)*.8));
  CH.to=CH.latest;
  // battle contract events
  CH.bat.sigs=[].concat(CFG.contracts.battle&&CFG.contracts.battle.events||[]).map(parseSig).filter(Boolean);
  if(CA('battle')&&CH.bat.sigs.length){const f=CH.bat.to?CH.bat.to+1:(CFG.contracts.battle.fromBlock||CFG.contracts.amber.fromBlock);
   if(f<=CH.latest)await scanLogs({address:CFG.contracts.battle.address,topics:[CH.bat.sigs.map(s=>s.topic)]},f,CH.latest,ingestBattle,(b,e)=>prog(t('progScan',{b:fmt(b),e:fmt(e),n:fmt(CH.blk.length)}),.8+.1*(b-f)/Math.max(1,e-f)));CH.bat.to=CH.latest}
  // gnome NFT transfers
  if(CA('gnomeNft')){const f=CH.gnm.to?CH.gnm.to+1:(CFG.contracts.gnomeNft.fromBlock||CFG.contracts.amber.fromBlock);
   if(f<=CH.latest)await scanLogs({address:CFG.contracts.gnomeNft.address,topics:[TOPIC_TRANSFER]},f,CH.latest,ingestGnome);CH.gnm.to=CH.latest}
  if(CA('castleNft')&&typeof ccScan==='function')await ccScan();
  await readGnome();await loadAnchors();
  CH.state='ok';saveCH();prog(t('progDone',{n:fmt(CH.blk.length),h:fmt(CH.addrs.length)}),1);setTimeout(()=>prog(null),3500);
  if(S.src==='chain'){buildChainSet();queueReplay()}
  startPoll();bannerRefresh();updStatsSoon();return true}
 catch(e){console.warn('chain load failed',e);CH.state=CH.blk.length?'ok':'fail';prog(null);
  if(CH.state==='fail'){if(S.src==='chain')setSource(EDITION==='prod'?'demo':'sim',true);bannerRefresh()}else{if(S.src==='chain')buildChainSet();bannerRefresh()}return false}}
function resetCH(){Object.assign(CH,{to:0,lastKey:-1,addrs:[],aIdx:new Map(),blk:[],fr:[],tt:[],val:[],tx:[],deadCum:[],balA:[],first:[],anchors:[]});CH.bat.ev=[];CH.bat.n={};CH.bat.to=0;CH.gnm.own=new Map();CH.gnm.log=[];CH.gnm.to=0}

 const n=c.blk.length;CH.blk=Array.from(c.blk);CH.fr=Array.from(c.fr);CH.tt=Array.from(c.tt);CH.val=Array.from(c.val);CH.tx=c.tx;CH.deadCum=new Array(n);let dc=0;

   endGame(id, winner) is called by the game operator; winner 0x0 = draw (each stake returned).
   Otherwise the winner gets 90% of the pool at once; the 10% (6 burn / 3 staking / 1 Bank) accrues in the
   contract and is paid out in a batch once ≥100 Amber has built up. Each player also pays a 0.01 POL service fee:
   one refunds the operator's gas, the other is swapped to LINK to top up the Chainlink Automation upkeep. */
const BATV={op:'0xdb2cc8e6747d81399dc6e6619220e8d46f3ce787',reg:'0x02777053d6764996e594c3e88af1d58d5363a2e6',node:'0xd9a31dc8347284a6bea9598d49d8dacbfd5774f1',

function batGames(){if(CH.bat._gn===CH.bat.ev.length&&CH.bat.G)return CH.bat.G;const G=new Map();
 for(const e of CH.bat.ev){const id=e.a.id;if(id==null)continue;let g=G.get(id);if(!g)G.set(id,g={id,s:0});
  if(e.n==='newGame'){g.c=lc(e.a.creator||'');g.s=g.s||e.a.amount||0;g.b0=e.b;g.tx0=e.tx}
  else if(e.n==='joinedGame'){g.p=lc(e.a.player||'');g.s=g.s||e.a.amount||0}
  else if(e.n==='endedGame'){g.w=lc(e.a.winner||'');g.b=e.b;g.tx=e.tx;g.s=g.s||e.a.amount||0;g.end=1}
  else if(/cancel/i.test(e.n)){g.x=1;g.b=e.b;g.tx=e.tx}}
 CH.bat.G=G;CH.bat._gn=CH.bat.ev.length;return G}

/* ===== Castle NFT collections (ERC-1155 via thirdweb; COMING SOON) =====
   One contract, token id 0,1,2,… = a separate castle COLLECTION with a fixed limited supply (≈10% of the player count at issue).
   Cosmetic only (castle skin, deck design, icons) + 1% royalty on resales on external marketplaces. Prices are never shown.
   sim  → example collections sized ~10% of the simulated players, clearly labelled «пример / example»
   chain→ CFG.contracts.castleNft.address empty → «coming soon»; filled → TransferSingle/TransferBatch, balances, supply, limits */
var CC={src:'none',list:[],w:new Map(),bal:new Map(),to:0,meta:new Map()};
const CC_COL=[0xf6c75a,0x7dd3fc,0xf472b6,0xa3e635,0xc084fc,0xff9f43,0x5eead4,0xfca5a5];
function ccCol(id){return CC_COL[((id|0)%CC_COL.length+CC_COL.length)%CC_COL.length]}
const ccHex=id=>'#'+ccCol(id).toString(16).padStart(6,'0');
function ccOf(i){return CC.w.get(i)||null}                           // [[id,count],…] sorted by id
function ccHas(i,id){const a=CC.w.get(i);return !!a&&a.some(e=>e[0]===id)}
function ccSkin(i){const a=CC.w.get(i);if(!a||!a.length)return null;const id=a[a.length-1][0];const f=(CFG.contracts.castleNft||{}).skinOf;
 if(CC.src==='chain'&&typeof f==='function'){try{const v=f(id);if(v!=null&&isFinite(v))return v|0}catch(e){}}return id}
function ccName(c){const r=L==='ru';const nm=(CFG.contracts.castleNft.names||{})[c.id]||(CC.src==='chain'&&c.nm)||null;return nm||(r?'Коллекция #':'Collection #')+c.id}
function ccReset(){CC.w=new Map();CC.list=[];if(S.ccF>=0){S.ccF=-1}}
/* --- sim: example collections --- */
function ccSim(){ccReset();CC.src='sim';const r=rng(9177),N=Math.max(50,PLAYERS||NW);
 const plan=[[.32,1],[.55,.97],[.8,.72],[1,.4]];
 plan.forEach(([f,iss],id)=>{const limit=Math.max(10,Math.round(N*.1*f/10)*10),issued=Math.round(limit*iss);const own=new Map();
  for(let k=0;k<issued;k++){const w=Math.floor(Math.pow(r(),1.25)*Math.min(N,NW));own.set(w,(own.get(w)||0)+1)}
  for(const [w,c] of own){if(!CC.w.has(w))CC.w.set(w,[]);CC.w.get(w).push([id,c])}
  CC.list.push({id,limit,issued,holders:own.size,ex:1})});
 ccRefresh()}
/* --- chain: ERC-1155 --- */
const CC_TS=keccak256('TransferSingle(address,address,address,uint256,uint256)'),CC_TB=keccak256('TransferBatch(address,address,address,uint256[],uint256[])');
const ccSel=s=>keccak256(s).slice(0,10);
function ccIngest(logs){let n=0;for(const l of logs||[]){if(l.topics.length!==4)continue;const fr='0x'+l.topics[2].slice(26),to='0x'+l.topics[3].slice(26),d=l.data.slice(2),W=k=>d.slice(k*64,k*64+64);let pairs=[];
  if(l.topics[0]===CC_TS)pairs=[[parseInt(W(0),16),parseInt(W(1),16)]];
  else if(l.topics[0]===CC_TB){const oi=parseInt(W(0),16)/32,ov=parseInt(W(1),16)/32,ni=parseInt(W(oi),16);for(let k=0;k<ni;k++)pairs.push([parseInt(W(oi+1+k),16),parseInt(W(ov+1+k),16)])}else continue;
  for(const [id,v] of pairs){if(!CC.bal.has(id))CC.bal.set(id,{m:0,b:0,h:new Map()});const B=CC.bal.get(id);
   if(fr===ZERO)B.m+=v;else B.h.set(fr,(B.h.get(fr)||0)-v);if(to===ZERO||to===DEAD)B.b+=v;else B.h.set(to,(B.h.get(to)||0)+v);n++}}return n}
async function ccRead(){const a=CA('castleNft');const ids=[...CC.bal.keys()].sort((x,y)=>x-y);let next=null;
 try{const v=await ethCall(a,ccSel('nextTokenIdToMint()'));if(v&&v!=='0x')next=parseInt(v,16)}catch(e){}
 if(next!=null)for(let k=0;k<next;k++)if(!CC.bal.has(k))CC.bal.set(k,{m:0,b:0,h:new Map()});
 const L2=[];for(const id of [...CC.bal.keys()].sort((x,y)=>x-y)){const B=CC.bal.get(id);let limit=(CFG.contracts.castleNft.limits||{})[id]||0,issued=B.m-B.b;
  try{const v=await ethCall(a,ccSel('maxTotalSupply(uint256)')+pad32(hx(id)));const x=v&&v!=='0x'?parseInt(v,16):0;if(x&&x<1e15)limit=x}catch(e){}
  try{const v=await ethCall(a,ccSel('totalSupply(uint256)')+pad32(hx(id)));if(v&&v!=='0x')issued=parseInt(v,16)}catch(e){}
  let holders=0;for(const [,c] of B.h)if(c>0)holders++;const old=CC.list.find(c=>c.id===id);L2.push({id,limit,issued,holders,nm:old&&old.nm});if(!CC.meta.has(id))ccMeta(id)}
 CC.list=L2}
async function ccMeta(id){CC.meta.set(id,1);try{const a=CA('castleNft');const u=decStr(await ethCall(a,'0x0e89341c'+pad32(hx(id))));if(!u)return;
 const url=u.replace('{id}',id.toString(16).padStart(64,'0'));const m=await ipfsLim(()=>fetchAny(url.startsWith('ipfs://')?ipfsUrls(url):[url],true));
 const c=CC.list.find(x=>x.id===id);if(m&&m.name&&c){c.nm=String(m.name).slice(0,40);ccRender()}}catch(e){}}
async function ccScan(){const c=CFG.contracts.castleNft;const f=CC.to?CC.to+1:(c.fromBlock||CFG.contracts.amber.fromBlock);
 try{if(f<=CH.latest)await scanLogs({address:c.address,topics:[[CC_TS,CC_TB]]},f,CH.latest,ccIngest);CC.to=CH.latest;await ccRead()}catch(e){}}
async function ccPoll(b,e){try{const lg=await rpc('eth_getLogs',[{address:CFG.contracts.castleNft.address,topics:[[CC_TS,CC_TB]],fromBlock:hx(b),toBlock:hx(e)}]);CC.to=e;
 if(ccIngest(lg)){await ccRead();ccChainMap();refreshCastles()}}catch(x){}}
function ccChainMap(){CC.w=new Map();if(!CA('castleNft')){CC.src='soon';CC.list=[];ccRefresh();return}CC.src='chain';
 for(const [id,B] of CC.bal)for(const [a,c] of B.h){if(c<=0)continue;const i=SET.byAddr.get(a);if(i==null)continue;if(!CC.w.has(i))CC.w.set(i,[]);CC.w.get(i).push([id,c])}
 for(const [,a] of CC.w)a.sort((x,y)=>x[0]-y[0]);ccRefresh()}
function ccRefresh(){if(S.ccF>=0&&!CC.list.some(c=>c.id===S.ccF))S.ccF=-1;if(typeof applyGnF==='function'&&NW)applyGnF();ccRender()}

 else h+=`<div class="sm"><b style="color:var(--gold)">${t('soon')}</b> · ${t('ccNoteSoon')}</div>`;
 for(const c of CC.list){const p=c.limit?Math.min(100,c.issued/c.limit*100):100,on=S.ccF===c.id;
  h+=`<div class="ccr"><div class="nm"><span class="sw" style="background:${ccHex(c.id)};color:${ccHex(c.id)}"></span><b>${ccName(c)}</b>${c.ex?`<span class="ccex">${t('ccEx')}</span>`:''}</div>
  <div class="bar"><i style="width:${p.toFixed(1)}%;background:linear-gradient(90deg,${ccHex(c.id)}99,${ccHex(c.id)})"></i></div>
  <div class="mt"><span>${t('ccIss',{a:fmt(c.issued),b:c.limit?fmt(c.limit):'—'})} · ${t('ccHold',{n:fmt(c.holders)})}</span><button class="ccf${on?' on':''}" data-id="${c.id}">${on?t('ccAll'):t('ccShow')}</button></div></div>`}
