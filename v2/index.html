  if(fly.trackFn){const q=fly.trackFn();if(isFinite(q.x+q.y+q.z))fly.toT.copy(q);else fly.trackFn=null}
  const toP=fly.toP||fly.toT.clone().add(fly.dir.clone().multiplyScalar(fly.dist));
  controls.target.lerpVectors(fly.fT,fly.toT,e);camera.position.lerpVectors(fly.fP,toP,e);

 tEntry:['w','tour',COL.pink],tPrize:['tour','w',COL.gold],mine:['gnome','w',COL.amber],join:['contract','w',0xffcf7a],in:['o','w',COL.usdc],out:['w','o',COL.fiat],burn:['w','burn',COL.burn],mintIn:['contract','w',0xffcf7a],payout:['pool','w',COL.gold],mNew:['w','pool',COL.vio],mJoin:['w','pool',COL.vio],mWin:['pool','w',COL.gold],mCancel:['pool','w',0x64748b],dexIn:['dex','w',0x22d3ee],dexOut:['w','dex',0x22d3ee],bankOut:['w','bank',COL.gold],gnOut:['w','o',COL.lil],evt:['pool','w',0x94a3b8]};
function simHistory(i){
 const r=rng(i*2654435761+99),ev=[];const j=SET.join[i];if(!isFinite(j))return {ev:[],sum:null};
 let bal=SET.bal0[i];ev.push({t:j,ty:'join',a:bal});
 const days=Math.max(0,(Math.min(0,S.simT)-j)/86400),act=SET.act[i];
 const nm=Math.round(days*act*MATCH_PER_PLAYER_DAY);
 for(let k=0;k<nm;k++){const tt=j+r()*(0-j),e=Math.min(sampleEntry(r),Math.max(10,Math.round(bal*.2)));const o=Math.floor(r()*N0);ev.push({t:tt,ty:'contrib',a:e,o});
  if(r()<.5)ev.push({t:tt+60,ty:'win',a:2*e*M.win,o});else ev.push({t:tt+60,ty:'loss',a:0,o})}
 if(r()<.35){const tt=j+r()*(0-j)*.5,a=Math.round(bal*(.1+r()*.3));ev.push({t:tt,ty:'stake',a});for(let q=tt+7*86400;q<0;q+=7*86400)ev.push({t:q,ty:'stakeR',a:Math.round(a*.004*(.5+r()))})}
 if(SET.gn[i]&&SET.gids.has(i)){const ids=SET.gids.get(i);const t0=SET.gAcq[i];ids.forEach((id,q)=>{const tt=t0+q*600;if(tt<=0)ev.push({t:tt,ty:'gnome',a:0,id})})}
 if(r()<.08){const tt=j+r()*(0-j);ev.push({t:tt,ty:'tEntry',a:M.tEntry});if(r()<.1)ev.push({t:tt+3600,ty:'tPrize',a:M.tPool*M.tP[3],pl:4})}
 ev.sort((a,b)=>a.t-b.t);
 for(const x of (LIVE_EV.get(i)||[]))ev.push({t:x[0],ty:x[1],a:x[2],o:x[1]==='gnome'||x[1]==='mine'||x[1]==='tPrize'?undefined:x[3],id:x[1]==='gnome'?x[3]:undefined});
 return {ev,sum:sumHist(ev,i)}}
function sumHist(ev,i){const s={joined:ev.length?ev[0].t:null,m:0,w:0,c:0,rw:0,st:0,tx:ev.length,bal:0};
 for(const e of ev){if(e.ty==='contrib'||e.ty==='tEntry'){s.m+=e.ty==='contrib'?1:0;s.c+=e.a;s.bal-=e.a}
  else if(e.ty==='win'||e.ty==='tPrize'||e.ty==='stakeR'||e.ty==='mine'){if(e.ty==='win')s.w++;s.rw+=e.a;s.bal+=e.a}
  else if(e.ty==='stake'){s.st+=e.a;s.bal-=e.a}else if(e.ty==='join'||e.ty==='in'||e.ty==='mintIn'){s.bal+=e.a}else if(e.ty==='out'||e.ty==='burn'){s.bal-=e.a}}
 if(SET.kind==='chain')s.bal=SET.bal[i];else s.bal=Math.max(0,s.bal);
 s.g=SET.gn[i];s.ids=(SET.gids.get(i)||[]).slice().sort((a,b)=>a-b);return s}

/* --- keccak-256 (for event topics) --- */
const KRC=['0x1','0x8082','0x800000000000808a','0x8000000080008000','0x808b','0x80000001','0x8000000080008081','0x8000000000008009','0x8a','0x88','0x80008009','0x8000000a','0x8000808b','0x800000000000008b','0x8000000000008089','0x8000000000008003','0x8000000000008002','0x8000000000000080','0x800a','0x800000008000000a','0x8000000080008081','0x8000000000008080','0x80000001','0x8000000080008008'].map(BigInt);
const KROT=[[0,36,3,41,18],[1,44,10,45,2],[62,6,43,15,61],[28,55,25,21,56],[27,20,39,8,14]];
function keccak256(str){const M64=(1n<<64n)-1n,rot=(v,n)=>n?((v<<BigInt(n))|(v>>BigInt(64-n)))&M64:v;
 const by=new TextEncoder().encode(str),rate=136,len=by.length,pad=rate-(len%rate),m=new Uint8Array(len+pad);m.set(by);m[len]^=1;m[m.length-1]^=0x80;
 const s=new Array(25).fill(0n);
 for(let off=0;off<m.length;off+=rate){for(let i=0;i<rate/8;i++){let v=0n;for(let b=7;b>=0;b--)v=(v<<8n)|BigInt(m[off+i*8+b]);s[i]^=v}
  for(let r=0;r<24;r++){const C=[0,1,2,3,4].map(x=>s[x]^s[x+5]^s[x+10]^s[x+15]^s[x+20]);
   for(let i=0;i<25;i++)s[i]^=C[(i%5+4)%5]^rot(C[(i%5+1)%5],1);
   const B=new Array(25);for(let x=0;x<5;x++)for(let y=0;y<5;y++)B[y+5*((2*x+3*y)%5)]=rot(s[x+5*y],KROT[x][y]);
   for(let x=0;x<5;x++)for(let y=0;y<5;y++)s[x+5*y]=B[x+5*y]^((~B[(x+1)%5+5*y])&M64&B[(x+2)%5+5*y]);s[0]^=KRC[r]}}
 let h='0x';for(let i=0;i<4;i++){let v=s[i];for(let b=0;b<8;b++){h+=Number(v&255n).toString(16).padStart(2,'0');v>>=8n}}return h}
// parse 'Name(type indexed name,…)' → {name,canon,topic,params:[{type,indexed,name}]}
function parseSig(sig){const m=/^\s*(\w+)\s*\(([^)]*)\)/.exec(sig||'');if(!m)return null;
 const params=m[2].trim()?m[2].split(',').map(x=>{const w=x.trim().split(/\s+/);let type=w[0];if(type==='uint')type='uint256';if(type==='int')type='int256';return {type,indexed:w.includes('indexed'),name:w.length>1&&w[w.length-1]!=='indexed'?w[w.length-1]:''}}):[];
 const canon=m[1]+'('+params.map(p=>p.type).join(',')+')';return {name:m[1],canon,topic:keccak256(canon),params}}
const TOPIC_TRANSFER=keccak256('Transfer(address,address,uint256)');

/* --- RPC with fallbacks + backoff --- */
const RPCS=CFG.network.rpcs.map(r=>Object.assign({dead:0},r));
async function rpcOne(r,method,params,ms=25000){const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),ms);
 try{const res=await fetch(r.url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:ac.signal});
  if(!res.ok)throw new Error('http '+res.status);const j=await res.json();if(j.error){const e=new Error(j.error.message||'rpc error');e.rpc=true;throw e}return j.result}finally{clearTimeout(tm)}}
async function rpc(method,params,opt={}){let last;const list=RPCS.filter(r=>!opt.archive||r.archive);
 for(let pass=0;pass<2;pass++){for(const r of list){if(pass===0&&r.dead>Date.now())continue;
  try{const v=await rpcOne(r,method,params);CH.rpc=r.url;return v}catch(e){last=e;if(e.rpc&&/revert|nonexistent|invalid opcode/i.test(e.message))throw e;r.dead=Date.now()+20000}}
  await sleep(600)}
 throw last||new Error('no rpc')}
const ethCall=(to,data,tag='latest')=>rpc('eth_call',[{to,data},tag]);
// adaptive eth_getLogs scan: grows span on success, divides by 3 on error, backs off, then switches node
async function scanLogs(filter,from,to,onChunk,onProg){
 const list=RPCS.filter(r=>r.archive).sort((a,b)=>b.maxRange-a.maxRange);let ri=0,b=from,span=Math.min(500000,list[0].maxRange),errs=0,req=0;
 while(b<=to){const r=list[ri];const e=Math.min(to,b+Math.min(span,r.maxRange)-1);
  try{const logs=await rpcOne(r,'eth_getLogs',[Object.assign({},filter,{fromBlock:hx(b),toBlock:hx(e)})],40000);req++;CH.rpc=r.url;
   onChunk(logs);b=e+1;errs=0;if(logs.length<8000)span=Math.min(span*2,r.maxRange);onProg&&onProg(b,to)}
  catch(err){errs++;span=Math.max(1000,Math.floor(span/3));await sleep(Math.min(5000,250*2**Math.min(errs,4)));
   if(errs>=7){ri++;errs=0;if(ri>=list.length)throw err;span=Math.min(span,list[ri].maxRange)}}}
 return req}
