<script>
/* =====================================================================
   ED_CONFIG — ЕДИНЫЙ БЛОК НАСТРОЕК / SHARED CONFIG (dev = /v2/, prod = /live/)
   Как подключить контракт: впишите адрес (0x…, 42 символа) в поле контракта.
   Пустая строка '' = контракт ещё не подключён, сцена показывает его как «не подключён».
   Когда адрес вписан, данные этого контракта читаются из блокчейна Polygon
   (в prod — сразу, в dev — после переключения «Данные: Блокчейн»).
   Поле events — необязательная сигнатура события в формате Solidity, например:
     'MatchSettled(uint256 indexed matchId,address indexed winner,uint256 pool)'
   Можно указать массив сигнатур.
   Если events пустое, контракт всё равно читается: по переводам Amber на его адрес
   и с его адреса (Transfer токена Amber) и по его балансу Amber.
   ===================================================================== */
window.ED_CONFIG={
 edition:'dev',               // 'dev' (/v2/) или 'prod' (/live/) — подставляется при сборке
 // Демо-турниры (только dev, симуляция): межсерверный раз в crossMin–crossMax с, турнир сервера раз в serverMin–serverMax с
 tournamentDemo:{crossMin:40,crossMax:60,serverMin:15,serverMax:20,crossServers:[3,5],players:[16,64]},
 network:{name:'Polygon PoS',chainId:137,explorer:'https://polygonscan.com',
  // Публичные RPC по порядку. maxRange — лимит блоков на один eth_getLogs, archive — отдаёт старые логи.
  rpcs:[
   {url:'https://gateway.tenderly.co/public/polygon',maxRange:3000000,archive:true},
   {url:'https://polygon-bor-rpc.publicnode.com',maxRange:9000,archive:false},
   {url:'https://rpc-mainnet.matic.quiknode.pro',maxRange:9000,archive:true},
   {url:'https://polygon.drpc.org',maxRange:5000,archive:true}
  ],
  pollSeconds:20                      // как часто проверять новые блоки
 },
 contracts:{
  amber:{address:'0x8865bc57c58be23137ace9ed1ae1a05fe5c8b209',type:'erc20',decimals:18,
   fromBlock:40824504,                // блок создания контракта Amber (найден по eth_getCode)
   events:'Transfer(address indexed from,address indexed to,uint256 value)'},
  dead:{address:'0x000000000000000000000000000000000000dEaD'},  // мёртвый адрес сжигания — чёрная дыра
  dexPair:{address:'0x2E7d9d93d19d90baf2f8bD256D15a94baaa0B443',fromBlock:0}, // пул ликвидности WPOL/Amber на DEX — держатель Amber
  battle:{address:'0x70b48944730312EA33EDd6589E04a4Eccc82ea82',fromBlock:64075709, // боевой контракт матчей 1 на 1 (пул матча)
   events:['newGame(uint256 indexed id,address indexed creator,uint256 indexed amount)',
           'joinedGame(uint256 indexed id,address indexed player,uint256 indexed amount)',
           'endedGame(uint256 indexed id,address indexed winner,uint256 indexed amount)',
           'gameCanceled(uint256 indexed id,address indexed creator)']},
  staking:{address:'0x592A33B84907b883A0Dbc767A0024D9063f7B3fA',fromBlock:0,events:''},    // стейкинг (3% с пула)
  bank:{address:'0x622dEcbD2d1dde2AF9e12A89E2f71cb541d2564e',fromBlock:0,events:''},       // Банк Студии (1% с пула, 5% турниров)
  gnomeNft:{address:'0x689f70bacd3cf75608c45e124e03c21fc5f5ab23',type:'erc721',fromBlock:65840712,maxSupply:9999,
   mintHolder:'',                     // адрес, где лежат непроданные гномы (если пусто — сам контракт гномов)
   opensea:'https://opensea.io/assets/matic/0x689f70bacd3cf75608c45e124e03c21fc5f5ab23/',
   collection:'https://opensea.io/collection/amber-digger',
   events:'Transfer(address indexed from,address indexed to,uint256 indexed tokenId)'},
  // NFT замков — СКОРО. Один контракт ERC-1155 (thirdweb): tokenId 0, 1, 2, … — это отдельные КОЛЛЕКЦИИ замков,
  // у каждой свой фиксированный лимит (выпуск ≈10% от числа игроков на момент выпуска). Только косметика: облик замка,
  // дизайн колоды, иконки. Роялти 1% с каждой перепродажи на внешних площадках (POL/USDC) — в Банк Студии. Цены не показываем.
  // Пустой адрес = панель «скоро». Когда впишете адрес, визуализация читает TransferSingle/TransferBatch, считает балансы,
  // выпуск и держателей каждой коллекции; лимит — из maxTotalSupply(id) (thirdweb), иначе из limits; облик замка у кошелька
  // берётся из его коллекций (skinOf(id) → облик 0…5, иначе id % 6).
  castleNft:{address:'',fromBlock:0,standard:'erc1155',opensea:'',
   limits:{},                         // необязательно: {0:1000, 1:5000} — если в контракте нет maxTotalSupply(id)
   names:{},                          // необязательно: {0:'Ледяные шпили'} — иначе имя из uri(id), иначе «Коллекция #id»
   skinOf:null,                       // необязательно: id коллекции → облик 0…5
   events:'TransferSingle(address indexed operator,address indexed from,address indexed to,uint256 id,uint256 value);TransferBatch(address indexed operator,address indexed from,address indexed to,uint256[] ids,uint256[] values)'},

  Все хуки необязательные. null = встроенное поведение (dev: демо-данные с пометкой «демо»; prod: «4X · скоро» / «скоро», без выдуманных чисел).
  Любой хук можно задать и снаружи до загрузки страницы: window.ED_castleProvider / ED_legionProvider / ED_authProvider. */

 // A. «Внутри замка» (будущая точка входа в 4X-игру). Функция (addr) → объект или Promise объекта:
 //   {buildings:[{id:'castle'|'infantry'|'pikemen'|'archers'|'infirmary'|'university'|'tavern'|'heroes'|'wall', level:1…30, max:30, start:1}],
 //    (9 построек: Замок, Казармы пехоты, Казармы копейщиков, Казармы лучников, Лечебница, Университет, Таверна, Зал героев,
 //     Стена = энергетический щит вокруг острова; яркость щита растёт с уровнем Стены. start — уровень, с которого начинал)
 //    army:число (необязательно), power:число (Мощь; если нет — считается из зданий и армии),
 //    nick:строка (необязательно), showNick:true|false (игрок разрешил показывать ник на карте),
 //    socials:{x:'https://x.com/…', tiktok:'…', youtube:'…', instagram:'…'} (все поля необязательные)}
 //   Вернуть null = замок без данных («4X · скоро»).
 castleProvider:null,

 // B. Ульи (кланы). Функция () → массив или Promise массива:
 //   [{id:'h1', name:'Вега', color:'#8fd3ff' (необязательно), players:['0x…', …] (обычно 50–100 игроков),
 //     power:число (суммарная Мощь, необязательно), wins:число (суммарные победы, необязательно)}]
 //   Замки участников стягиваются в поясе ближе друг к другу, вокруг — общая аура и подпись: название · Мощь.
 legionProvider:null,
 // Как называть ульи в интерфейсе: {ru:'Ульи', en:'Hives', ru1:'Улей', en1:'Hive'} (мн. и ед. число)
 legionTerm:{ru:'Ульи',en:'Hives',ru1:'Улей',en1:'Hive'},

 // C. Единый аккаунт с игрой (вход через Google / Apple / Email). null = кнопки «скоро», сайт ничего не собирает.

 //   профиль = {nick, wallet:'0x…' (внутриигровой кошелёк, создаётся автоматически через thirdweb), socials:{…}, showNick:true|false}
 //   Внешние кошельки не привязываются. Кошелёк некастодиальный: фраза восстановления есть только у игрока,

 authProvider:null,

 // Аудиты: на сайте одна строка «Аудиты смарт-контрактов имеются» — без дат и ссылок.
 audits:null
};

 `<p>Синее туманное кольцо вокруг системы — Chainlink, сеть децентрализованных оракулов и автоматизации, в которой работает и наша экосистема.</p><p>Роль в Amber: Chainlink раз в сутки проверяет контракт LP-стейкинга: у кого срок блокировки закончился, тому контракт автоматически возвращает LP вместе с накопленными Amber. Средства на апкип вносит боевой контракт: сервисный сбор матчей (0,01 POL с игрока) копится, при раздаче долей пула меняется на LINK через DEX, переводится в формат ERC-677 через PegSwap и вносится в реестр Automation.</p><p>Победителя матча Chainlink не выбирает: функцию endGame вызывает сервисный кошелёк «Оператор», и контракт сразу выплачивает победителю 90% пула.</p>`:

 `<p>Тонкий эфирный щит — студия Electrum Decisions. Он держит всю экосистему вместе: камень Amber, боевой контракт, стейкинг, Банк Студии, гномов, шахту и кошельки игроков.</p><p>Внутри щита — всё, что создаёт и поддерживает студия. Снаружи — внешние площадки и кольцо партнёра thirdweb; кольцо Chainlink проходит через щит.</p>`:
 `<p>The thin ether shield is the Electrum Decisions studio. It holds the whole ecosystem together: the Amber stone, the battle contract, staking, the Studio Bank, the gnomes, the mine and the player wallets.</p><p>Inside the shield is everything the studio builds and runs. Outside are the external marketplaces and the thirdweb partner ring; the Chainlink ring passes through the shield.</p>`,
 n:[[r?'Студия':'Studio','Electrum Decisions'],[r?'Игра':'Game','Decision Arena'],[r?'Сеть':'Network','Polygon']],
 x:`<p class="note">${r?'Щит — образ студии, а не смарт-контракт. Отдалите камеру до предела — за экосистемой кто-то наблюдает.':'The shield is an image of the studio, not a smart contract. Zoom all the way out: something is watching the ecosystem.'}</p>`}),
 ext:()=>{const c=CA('castleNft');return {k:r?'Вне игры · '+(c?'контракт подключён':'скоро'):'Outside the game · '+(c?'contract connected':'coming soon'),h:t('nExt'),b:r?
 `<p>Внутриигрового рынка нет и не будет: NFT продают и покупают вне игры, на внешних площадках.</p><p>С перепродаж будущих NFT замков (косметика) студия получает роялти 1% в POL/USDC — площадки перечисляют его автоматически в Банк Студии. Роялти зашито в контракт NFT замков: ровно 1%, изменить его нельзя. Скоро. Это дополнительный доход в криптовалюте сверх модели, поэтому в расчётах модели он не учтён. У гномов роялти нет.</p>`:
 `<p>There is no in-game market and there never will be: NFTs are bought and sold outside the game, on external marketplaces.</p><p>On resales of the future castle NFTs (cosmetics) the studio gets a 1% royalty in POL/USDC, paid automatically by the marketplaces into the Studio Bank. The royalty is hardcoded in the castle NFT contract: fixed at 1%, it cannot be changed. Coming soon. It is extra crypto income on top of the model, so the model’s numbers leave it out. Gnomes carry no royalty.</p>`,
 n:[[r?'Роялти':'Royalty',pct(M.roy)+' · POL/USDC'],[r?'Размер роялти в контракте':'Royalty rate in the contract',r?'1% · зашито, не меняется':'1% · hardcoded, unchangeable'],[r?'Получатель':'Recipient',t('nBank')],[r?'Контракт NFT замков':'Castle NFT contract',c?`<a href="${scanAddr(c)}" target="_blank" rel="noopener">${short(c)} ↗</a>`:t('soon')]]}},
 contract:()=>({k:r?'Камень души · токен в сети Polygon':'The Soul Stone · a token on Polygon',h:t('nContract'),b:r?
 `<p>Amber — центр всей экономики. Каждый взнос в пул матча, каждая награда, сжигание и майнинг — это движение Amber между кошельками и контрактами вокруг Камня души. Гномы добывают его, а золотой эфир внутри камня — это энергия, которую черпают игроки.</p><p>Новых Amber не выпускается: все 10 млрд уже выпущены. Дальше предложение может только уменьшаться.</p>`:
 `<p>Amber is the centre of the whole economy. Every match pool contribution, reward, burn and mining payout is Amber moving between the wallets and contracts around the Soul Stone. The gnomes mine it, and the golden ether inside the stone is the energy players draw on.</p><p>No new Amber is issued: all 10 bn already exist. From here supply can only go down.</p>`,
 n:[[r?'Общая эмиссия':'Total supply',big(M.supply)+(r?' (выпущена полностью)':' (fully issued)')],[r?'Сожжено (по модели)':'Burned (per model)',big(M.burned)],[r?'В обращении':'In circulation',big(M.circ)],[r?'Резерв майнинга':'Mining reserve',big(M.reserve)],[r?'Призовой резерв турниров':'Tournament prize reserve',big(M.prizeRes)],[r?'Матчей на Amber уже сыграно':'Amber matches played so far',fmt(M.histMatches)],[r?'Взнос в пул матча':'Match pool contribution',fmt(M.entryMin)+' – '+fmt(M.entryMax)+' Amber']],
 x:supplyBar()+`<p class="note">${r?'«Сожжено» — по финансовой модели, с учётом первого шага плана. Сколько Amber лежит на мёртвом адресе прямо сейчас, показывает режим «Блокчейн».':'“Burned” is per the financial model, including the first step of the plan. Blockchain mode shows how much Amber sits at the dead address right now.'}</p>`}),
 pool:()=>({k:r?'1 на 1 · боевой контракт':'1v1 · the battle contract',h:t('nPool'),b:r?
 `<p>Два игрока вносят в пул одинаковую сумму, так что пул всегда равен двум взносам. Пока идёт матч, Amber лежат в боевом контракте, и ни у одной из сторон нет к ним доступа.</p><p>Студия в матче не участвует и против игроков не играет. Она получает фиксированный 1% с пула, кто бы ни победил.</p>`:
 `<p>Two players put the same amount into the pool, so the pool always equals two contributions. While the match runs, the Amber sits in the battle contract and neither side can touch it.</p><p>The studio takes no part in the match and never plays against players. It gets a fixed 1% of the pool whoever wins.</p>`,
 n:[[r?'Победителю':'To the winner',pct(M.win)],[r?'Сжигание':'Burn',pct(M.burn)],[r?'Стейкерам':'To stakers',pct(M.stake)],[r?'Студии (фиксированно)':'Studio (fixed)',pct(M.studio)],[r?'Пример: взносы 2 × 10 000':'Example: contributions 2 × 10,000',(r?'пул ':'pool ')+fmt(M.exPool)],[r?'Из пула 20 000':'From a 20,000 pool',`${fmt(M.exWin)} / ${fmt(M.exBurn)} / ${fmt(M.exStake)} / ${fmt(M.exStudio)}`],[r?'Средний взнос в модели':'Average contribution in the model',fmt(M.avgEntry)+' Amber']],
 x:`<p class="note">${r?'Средний взнос — допущение модели по распределению взносов от 10 до 250 000 Amber.':'The average contribution is a model assumption based on a spread from 10 to 250,000 Amber.'}</p><p class="note">${r?'Как контракт завершает матч: сервисный кошелёк «Оператор» вызывает endGame, победитель сразу получает 90% пула. Ничья — это endGame с победителем 0x000…0000: каждому полностью возвращается его взнос в пул матча, без сжигания, стейкинга и Банка. Отмена (никто не присоединился) возвращает взнос создателю. Доли 6% / 3% / 1% копятся в контракте и уходят на мёртвый адрес, в стейкинг и в Банк пакетом, когда наберётся 100 Amber. Сервисный сбор 0,01 POL с игрока: одна часть покрывает газ Оператора, другая превращается в LINK для Chainlink Automation.':'How the contract finishes a match: the “Operator” service wallet calls endGame and the winner gets 90% of the pool at once. A draw is endGame with winner 0x000…0000: each player’s match pool contribution is refunded in full, with no burn, staking or Bank share. A cancellation (nobody joined) refunds the creator. The 6% / 3% / 1% shares accrue in the contract and go to the dead address, staking and the Bank in one batch once 100 Amber has built up. Service fee 0.01 POL per player: one part covers the Operator’s gas, the other becomes LINK for Chainlink Automation.'}</p>${typeof recentMatchesHTML==='function'?recentMatchesHTML():''}<div class="btns simOnly"><button onclick="window.__play()">${t('playMatch')}</button></div>`}),
 burn:()=>({k:r?'Мёртвый адрес · 6% каждого пула':'The dead address · 6% of every pool',h:t('nBurn'),b:r?
 `<p>6% каждого пула боевой контракт отправляет на мёртвый адрес 0x…dEaD. Это чёрная дыра: ключа к адресу нет ни у кого, и Amber оттуда не возвращаются никогда. Диск растёт и светится ярче с каждым сжиганием.</p><p>Сюда же падает Amber, купленный на 80% от минта гномов. Сколько Amber при этом сгорит, зависит от рынка, поэтому эту часть мы показываем в долларах и в Amber не прогнозируем.</p>`:
 `<p>The battle contract sends 6% of every pool to the dead address 0x…dEaD. This is the black hole: nobody holds a key to it, and Amber never comes back. The disk grows and glows brighter with every burn.</p><p>Amber bought with 80% of the gnome mint falls in here too. How much Amber that burns depends on the market, so we show that part in dollars and do not forecast it in Amber.</p>`,
 n:[[r?'С каждого пула':'From every pool',pct(M.burn)],[r?'Из пула 20 000':'From a 20,000 pool',fmt(M.exBurn)+' Amber'],[r?'Минт гномов: на выкуп и сжигание':'Gnome mint: buy & burn',usd(M.mintBB)],[r?'Новая эмиссия':'New issuance',t('none')],[r?'Адрес':'Address',short(DEAD)]],
 x:`<p class="note"><a href="${scanAddr(CFG.contracts.dead.address)}" target="_blank" rel="noopener">0x…dEaD · Polygonscan ↗</a></p>`}),
 staking:()=>({k:r?'LP-стейкинг · награды в Amber':'LP staking · rewards in Amber',h:r?'LP-стейкинг':'LP staking',b:r?
 `<p>Это LP-стейкинг: в него вносят LP-токены пула QuickSwap WPOL/Amber, а награды начисляются в Amber.</p><p>Каждый бой отправляет 3% пула в пул стейкинга. Эти Amber делятся между теми, кто сейчас в стейкинге, по LP × множитель срока.</p><p>Когда срок заканчивается, LP и накопленные Amber возвращаются автоматически: Chainlink раз в сутки проверяет, у кого срок закончился. Награда приходит одним переводом вместе с LP.</p><p>Досрочный выход возвращает только ваши LP, без награды. Эта награда остаётся другим стейкерам.</p>`:
 `<p>This is LP staking: you stake LP tokens of the QuickSwap WPOL/Amber pool, and rewards accrue in Amber.</p><p>Each battle sends 3% of its pool to the staking pool. That Amber is shared among current stakers by LP × the term multiplier.</p><p>At the end of the term, your LP and the accrued Amber are returned automatically: Chainlink checks once a day for finished terms. The reward arrives in one transfer together with the LP.</p><p>Early exit returns only your LP, with no reward. That reward stays with the other stakers.</p>`,
 n:[[r?'Что вносят':'What you stake',r?'LP QuickSwap WPOL/Amber':'QuickSwap WPOL/Amber LP'],[r?'Награды':'Rewards',r?'в Amber':'in Amber'],[r?'С каждого боя':'From every battle',pct(M.stake)],[r?'Из пула 20 000':'From a 20,000 pool',fmt(M.exStake)+' Amber'],[r?'Конец срока':'End of term',r?'LP + Amber, автоматически':'LP + Amber, automatically'],[r?'Досрочный выход':'Early exit',r?'только LP, без награды':'LP only, no reward']],
 x:lockTerms(r)}),
 bank:()=>({k:r?'Доход студии в Amber':'Studio income in Amber',h:t('nBank'),b:r?
 `<p>Студия зарабатывает на обороте, а не на исходах матчей. В Банк идёт фиксированный 1% с каждого пула матча и 5% призового пула каждого турнира.</p><p>Студия не играет против игроков, и исход матча на её доход не влияет.</p><p>Сверх модели, в криптовалюте: роялти 1% с перепродаж будущих NFT замков (косметика) на внешних площадках вне игры, в POL/USDC. Площадки перечисляют его автоматически в Банк Студии. Роялти зашито в контракт NFT замков: ровно 1%, изменить его нельзя. Скоро.</p>`:
 `<p>The studio earns on volume, not on match outcomes. The Bank gets a fixed 1% of every match pool and 5% of every tournament prize pool.</p><p>The studio never plays against players, and the result of a match does not change its income.</p><p>On top of the model, in crypto: a 1% royalty from resales of the future castle NFTs (cosmetics) on external marketplaces outside the game, in POL/USDC. The marketplaces pay it automatically into the Studio Bank. The royalty is hardcoded in the castle NFT contract: fixed at 1%, it cannot be changed. Coming soon.</p>`,
 n:[[r?'С пула матча':'From a match pool',pct(M.studio)],[r?'С призового пула турнира':'From a tournament prize pool',pct(M.tBank)],[r?'Пул 20 000':'A 20,000 pool',fmt(M.exStudio)+' Amber'],[r?'Турнир 1 280 000':'A 1,280,000 tournament',fmt(M.tPool*M.tBank)+' Amber'],[r?'Роялти с перепродаж NFT замков (внешние площадки)':'Royalty on castle NFT resales (external marketplaces)',pct(M.roy)+' · POL/USDC · '+(CA('castleNft')?(r?'контракт подключён':'contract connected'):(r?'скоро':'coming soon'))]]}),
  tour:()=>({k:r?'Скоро · на выбывание · примерно с '+M.tStart+'-го месяца плана':'Coming soon · single elimination · from about month '+M.tStart,h:t('nTour'),b:r?
 `<p>Турнир на выбывание: 128 игроков, 7 раундов, в каждом матче один выбывает. Взносы всех участников собираются в призовой пул в контракте турниров, а после финала контракт раздаёт его четырём лучшим и Банку студии.</p>`:
 `<p>A single-elimination tournament: 128 players, 7 rounds, one player drops out of each match. All contributions go into a prize pool in the tournament contract, and after the final it pays out to the top four and the studio’s Bank.</p>`,

 gnome:()=>({k:r?'В обороте максимум 9 999 NFT':'9,999 NFTs maximum in circulation',h:t('nGnome'),b:r?
 `<p>Лимит контракта — 10 000 гномов, но гном #0 сожжён ещё при минте и лежит на мёртвом адресе 0x…dEaD. Поэтому в обороте может быть максимум 9 999 гномов. Непроданные гномы лежат кучкой в самом контракте, сминченные улетают в кошельки владельцев. Застейканный гном майнит Amber из резерва майнинга; новые Amber при этом не выпускаются.</p><p>Раунд минта — 5 555 гномов по $300 в USDC внутри общего лимита 9 999. 80% выручки сразу выкупает Amber в пуле, и купленные Amber сжигаются. Майнинг включается, когда у игроков 7 999 из 9 999 гномов.</p>`:
 `<p>The contract limit is 10,000 gnomes, but gnome #0 was burned at mint and sits at the dead address 0x…dEaD. So at most 9,999 gnomes can ever be in circulation. Unsold gnomes sit in a cluster inside the contract; minted ones fly to their owners’ wallets. A staked gnome mines Amber from the mining reserve; no new Amber is created.</p><p>The mint round is 5,555 gnomes at $300 in USDC within the overall 9,999 cap. 80% of the revenue immediately buys Amber in the pool, and that Amber is burned. Mining switches on once players hold 7,999 of 9,999 gnomes.</p>`,
 n:[[r?'Лимит контракта':'Contract limit',fmt(10000)],[r?'Сожжён при минте':'Burned at mint',r?'1 (#0, мёртвый адрес)':'1 (#0, dead address)'],[r?'В обороте максимум':'Circulation maximum',fmt(M.gnomes)],[r?'Раунд минта':'Mint round',fmt(M.mintAvail)+' × '+usd(M.mintPx)+' = '+usd(M.mintRev)],[r?'На выкуп и сжигание Amber (80%)':'Buy & burn Amber (80%)',usd(M.mintBB)],[r?'Старт майнинга':'Mining starts at',fmt(M.mineThr)+(r?' из ':' of ')+fmt(M.gnomes)],[r?'Резерв майнинга':'Mining reserve',big(M.reserve)+' Amber'],[r?'Из резерва в месяц':'Released per month',big(M.monthRel)+' Amber'],[r?'На гнома в месяц':'Per gnome per month','≈'+fmt2(M.perGnome,2)+' Amber']],
 x:`<p class="note">${r?'Расчёт модели: 80% гномов застейканы, раздача равномерная примерно 5 лет. Цвет и размер кошелька на схеме — сколько у него гномов (см. легенду).':'Model calculation: 80% of gnomes staked, even payout over about 5 years. A wallet’s colour and size on the map show how many gnomes it holds (see the legend).'}</p><div class="btns simOnly"><button onclick="window.__mint()">${t('mintBtn')}</button></div>`}),
 reserve:()=>({k:r?'Скоро · 1 млрд Amber':'Coming soon · 1 bn Amber',h:t('nReserve'),b:r?
 `<p>Это 1 млрд Amber, отложенный под майнинг гномов. Он входит в уже выпущенные 10 млрд и новой эмиссией не является. Резерв раздаётся постепенно, равными долями, примерно за 5 лет.</p>`:
 `<p>This is 1 bn Amber set aside for gnome mining. It is part of the 10 bn already issued, not new issuance. The reserve is paid out gradually, in equal parts, over about 5 years.</p>`,

 fiat:()=>({k:r?'Основной доход студии · без токенов':'The studio’s main revenue · no tokens',h:t('nFiat'),b:r?
 `<p>Большинство игроков играет бесплатно, без кошелька и без Amber. Студия зарабатывает на рекламе (rewarded и межстраничной) и на покупках в магазинах приложений.</p><p>На этом кольце построена вся финансовая модель. Токен-режим идёт сверху как дополнительный потенциал и в оценку не входит.</p>`:

 x:`<p class="note">${r?'Базовый сценарий финансовой модели, это допущения.':'Base scenario of the financial model; these are assumptions.'}</p>`})

 const tok=v=>typeof v==='string'?v.replace(' · POL/USDC',r?' · токены POL/USDC':' · POL/USDC tokens'):v;
 if(key==='ext'||key==='bank'||key==='tw')rows(([a,v])=>[a,tok(v)]);
 if(key==='ext'){rep('роялти 1% в POL/USDC','роялти 1% в токенах POL/USDC');rep('a 1% royalty in POL/USDC','a 1% royalty in POL/USDC tokens');
  rep('Это дополнительный доход в криптовалюте сверх модели, поэтому в расчётах модели он не учтён.','Это дополнительные токены сверх модели, поэтому в расчётах модели они не учтены.');
  rep('It is extra crypto income on top of the model, so the model’s numbers leave it out.','These are extra tokens on top of the model, so the model’s numbers leave them out.')}
 if(key==='bank'){rep('Сверх модели, в криптовалюте: роялти','Сверх модели, в токенах: роялти');rep('вне игры, в POL/USDC.','вне игры, в токенах POL/USDC.');
  rep('On top of the model, in crypto: a 1% royalty','On top of the model, in tokens: a 1% royalty');rep('outside the game, in POL/USDC.','outside the game, in POL/USDC tokens.')}
 if(key==='link')rows(([a,v])=>[a==='VRF и ценовые фиды'?'VRF и фиды данных':a==='VRF and price feeds'?'VRF and data feeds':a,v]);
 if(key==='burn'){rep('Сюда же падает Amber, купленный на 80% от минта гномов. Сколько Amber при этом сгорит, зависит от рынка, поэтому эту часть мы показываем в долларах и в Amber не прогнозируем.','Сюда же падает Amber, выкупленный в пуле за счёт минта гномов. Сколько Amber при этом сгорит, зависит от рынка, поэтому в Amber эту часть мы не прогнозируем.');

 for(let k=0;k<nm;k++){const tt=j+r()*(0-j),e=Math.min(sampleEntry(r),Math.max(10,Math.round(bal*.2)));const o=Math.floor(r()*N0);ev.push({t:tt,ty:'contrib',a:e,o});
  const u=r();if(u<.006)ev.push({t:tt+60,ty:'refund',a:e,o,s:e,md:matchLine(e,'draw',false)});else if(u<.503)ev.push({t:tt+60,ty:'win',a:2*e*M.win,o,s:e});else ev.push({t:tt+60,ty:'loss',a:0,o,s:e})}
 const cl=SET.cls[i];if(cl===1||cl===2){const n=cl===2?60+Math.floor(r()*140):2+Math.floor(r()*10);for(let k=0;k<n;k++){const tt=j+r()*(0-j),a=Math.round(bal*(.05+r()*.4));ev.push({t:tt,ty:'dexIn',a});if(cl===2)ev.push({t:tt+2,ty:'dexOut',a:Math.round(a*(1.002+r()*.01))});else if(r()<.5)ev.push({t:tt+r()*86400*3,ty:'dexOut',a:Math.round(a*(.6+r()*.8))})}}

 if(!cl&&r()<.35){const tt=j+r()*(0-j)*.5,a=Math.round(bal*(.1+r()*.3));ev.push({t:tt,ty:'stake',a});for(let q=tt+7*86400;q<0;q+=7*86400)ev.push({t:q,ty:'stakeR',a:Math.round(a*.004*(.5+r()))})}
 if(SET.gn[i]&&SET.gids.has(i)){const ids=SET.gids.get(i);const t0=SET.gAcq[i];ids.forEach((id,q)=>{const tt=t0+q*600;if(tt<=0)ev.push({t:tt,ty:'gnome',a:0,id})})}

async function rpcOne(r,method,params,ms=25000){const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),ms);
 try{const res=await fetch(r.url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:ac.signal});
  if(!res.ok)throw new Error('http '+res.status);const j=await res.json();if(j.error){const e=new Error(j.error.message||'rpc error');e.rpc=true;throw e}return j.result}finally{clearTimeout(tm)}}
async function rpc(method,params,opt={}){let last;const list=RPCS.filter(r=>!opt.archive||r.archive);
 for(let pass=0;pass<2;pass++){for(const r of list){if(pass===0&&r.dead>Date.now())continue;
  try{const v=await rpcOne(r,method,params);CH.rpc=r.url;return v}catch(e){last=e;if(e.rpc&&/revert|nonexistent|invalid opcode/i.test(e.message))throw e;r.dead=Date.now()+20000}}
  await sleep(600)}

// adaptive eth_getLogs scan: grows span on success, divides by 3 on error, backs off, then switches node
async function scanLogs(filter,from,to,onChunk,onProg){
 const list=RPCS.filter(r=>r.archive).sort((a,b)=>b.maxRange-a.maxRange);let ri=0,b=from,span=Math.min(500000,list[0].maxRange),errs=0,req=0;
 while(b<=to){const r=list[ri];const e=Math.min(to,b+Math.min(span,r.maxRange)-1);
  try{const logs=await rpcOne(r,'eth_getLogs',[Object.assign({},filter,{fromBlock:hx(b),toBlock:hx(e)})],40000);req++;CH.rpc=r.url;
   onChunk(logs);b=e+1;errs=0;if(logs.length<8000)span=Math.min(span*2,r.maxRange);onProg&&onProg(b,to)}
  catch(err){errs++;span=Math.max(1000,Math.floor(span/3));await sleep(Math.min(5000,250*2**Math.min(errs,4)));
   if(errs>=7){ri++;errs=0;if(ri>=list.length)throw err;span=Math.min(span,list[ri].maxRange)}}}
 return req}

/* ===== Castle NFT collections (ERC-1155 via thirdweb; COMING SOON) =====
   One contract, token id 0,1,2,… = a separate castle COLLECTION with a fixed limited supply (≈10% of the player count at issue).
   Cosmetic only (castle skin, deck design, icons) + 1% royalty on resales on external marketplaces. Prices are never shown.
   sim  → example collections sized ~10% of the simulated players, clearly labelled «пример / example»
   chain→ CFG.contracts.castleNft.address empty → «coming soon»; filled → TransferSingle/TransferBatch, balances, supply, limits */
var CC={src:'none',list:[],w:new Map(),bal:new Map(),to:0,meta:new Map()};
const CC_COL=[0xf6c75a,0x7dd3fc,0xf472b6,0xa3e635,0xc084fc,0xff9f43,0x5eead4,0xfca5a5];
function ccCol(id){return CC_COL[((id|0)%CC_COL.length+CC_COL.length)%CC_COL.length]}
const ccHex=id=>'#'+ccCol(id).toString(16).padStart(6,'0');
function ccOf(i){return CC.w.get(i)||null}                           // [[id,count],…] sorted by id
function ccHas(i,id){const a=CC.w.get(i);return !!a&&a.some(e=>e[0]===id)}
function ccSkin(i){const a=CC.w.get(i);if(!a||!a.length)return null;const id=a[a.length-1][0];const f=(CFG.contracts.castleNft||{}).skinOf;
 if(CC.src==='chain'&&typeof f==='function'){try{const v=f(id);if(v!=null&&isFinite(v))return v|0}catch(e){}}return id}
function ccName(c){const r=L==='ru';const nm=(CFG.contracts.castleNft.names||{})[c.id]||(CC.src==='chain'&&c.nm)||null;return nm||(r?'Коллекция #':'Collection #')+c.id}
function ccReset(){CC.w=new Map();CC.list=[];if(S.ccF>=0){S.ccF=-1}}
/* --- sim: example collections --- */
function ccSim(){ccReset();CC.src='sim';const r=rng(9177),N=Math.max(50,PLAYERS||NW);
 const plan=[[.32,1],[.55,.97],[.8,.72],[1,.4]];
 plan.forEach(([f,iss],id)=>{const limit=Math.max(10,Math.round(N*.1*f/10)*10),issued=Math.round(limit*iss);const own=new Map();
  for(let k=0;k<issued;k++){const w=Math.floor(Math.pow(r(),1.25)*Math.min(N,NW));own.set(w,(own.get(w)||0)+1)}
  for(const [w,c] of own){if(!CC.w.has(w))CC.w.set(w,[]);CC.w.get(w).push([id,c])}
  CC.list.push({id,limit,issued,holders:own.size,ex:1})});
 ccRefresh()}
/* --- chain: ERC-1155 --- */
const CC_TS=keccak256('TransferSingle(address,address,address,uint256,uint256)'),CC_TB=keccak256('TransferBatch(address,address,address,uint256[],uint256[])');
const ccSel=s=>keccak256(s).slice(0,10);
function ccIngest(logs){let n=0;for(const l of logs||[]){if(l.topics.length!==4)continue;const fr='0x'+l.topics[2].slice(26),to='0x'+l.topics[3].slice(26),d=l.data.slice(2),W=k=>d.slice(k*64,k*64+64);let pairs=[];
  if(l.topics[0]===CC_TS)pairs=[[parseInt(W(0),16),parseInt(W(1),16)]];
  else if(l.topics[0]===CC_TB){const oi=parseInt(W(0),16)/32,ov=parseInt(W(1),16)/32,ni=parseInt(W(oi),16);for(let k=0;k<ni;k++)pairs.push([parseInt(W(oi+1+k),16),parseInt(W(ov+1+k),16)])}else continue;
  for(const [id,v] of pairs){if(!CC.bal.has(id))CC.bal.set(id,{m:0,b:0,h:new Map()});const B=CC.bal.get(id);
   if(fr===ZERO)B.m+=v;else B.h.set(fr,(B.h.get(fr)||0)-v);if(to===ZERO||to===DEAD)B.b+=v;else B.h.set(to,(B.h.get(to)||0)+v);n++}}return n}
async function ccRead(){const a=CA('castleNft');const ids=[...CC.bal.keys()].sort((x,y)=>x-y);let next=null;
 try{const v=await ethCall(a,ccSel('nextTokenIdToMint()'));if(v&&v!=='0x')next=parseInt(v,16)}catch(e){}
 if(next!=null)for(let k=0;k<next;k++)if(!CC.bal.has(k))CC.bal.set(k,{m:0,b:0,h:new Map()});
 const L2=[];for(const id of [...CC.bal.keys()].sort((x,y)=>x-y)){const B=CC.bal.get(id);let limit=(CFG.contracts.castleNft.limits||{})[id]||0,issued=B.m-B.b;
  try{const v=await ethCall(a,ccSel('maxTotalSupply(uint256)')+pad32(hx(id)));const x=v&&v!=='0x'?parseInt(v,16):0;if(x&&x<1e15)limit=x}catch(e){}
  try{const v=await ethCall(a,ccSel('totalSupply(uint256)')+pad32(hx(id)));if(v&&v!=='0x')issued=parseInt(v,16)}catch(e){}
  let holders=0;for(const [,c] of B.h)if(c>0)holders++;const old=CC.list.find(c=>c.id===id);L2.push({id,limit,issued,holders,nm:old&&old.nm});if(!CC.meta.has(id))ccMeta(id)}
 CC.list=L2}
async function ccMeta(id){CC.meta.set(id,1);try{const a=CA('castleNft');const u=decStr(await ethCall(a,'0x0e89341c'+pad32(hx(id))));if(!u)return;
 const url=u.replace('{id}',id.toString(16).padStart(64,'0'));const m=await ipfsLim(()=>fetchAny(url.startsWith('ipfs://')?ipfsUrls(url):[url],true));
 const c=CC.list.find(x=>x.id===id);if(m&&m.name&&c){c.nm=String(m.name).slice(0,40);ccRender()}}catch(e){}}
async function ccScan(){const c=CFG.contracts.castleNft;const f=CC.to?CC.to+1:(c.fromBlock||CFG.contracts.amber.fromBlock);
 try{if(f<=CH.latest)await scanLogs({address:c.address,topics:[[CC_TS,CC_TB]]},f,CH.latest,ccIngest);CC.to=CH.latest;await ccRead()}catch(e){}}
async function ccPoll(b,e){try{const lg=await rpc('eth_getLogs',[{address:CFG.contracts.castleNft.address,topics:[[CC_TS,CC_TB]],fromBlock:hx(b),toBlock:hx(e)}]);CC.to=e;
 if(ccIngest(lg)){await ccRead();ccChainMap();refreshCastles()}}catch(x){}}
function ccChainMap(){CC.w=new Map();if(!CA('castleNft')){CC.src='soon';CC.list=[];ccRefresh();return}CC.src='chain';
 for(const [id,B] of CC.bal)for(const [a,c] of B.h){if(c<=0)continue;const i=SET.byAddr.get(a);if(i==null)continue;if(!CC.w.has(i))CC.w.set(i,[]);CC.w.get(i).push([id,c])}
