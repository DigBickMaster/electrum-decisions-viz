iagrams. The deepest wells are under the Soul Stone and the black hole.</p><p>The token, the gnomes, the battle contract, staking and the Bank are only a small part of this network.</p>",n:[[e?"Сеть":"Network","Polygon PoS · chainId 137"],[e?"Газ":"Gas","POL"],[e?"Сервисный сбор матча":"Match service fee",e?"0,01 POL с игрока":"0.01 POL per player"]],x:'<p class="note"><a href="https://polygonscan.com" target="_blank" rel="noopener">Polygonscan ↗</a></p>'}),link:()=>({k:e?"Кольцо туманности · оракулы":"Nebula ring · oracles",h:"Chainlink",b:e?"<p>Chainlink — сеть децентрализованных оракулов: экосистема использует её как оракул для смарт-контрактов.</p>":"<p>Chainlink is a decentralised oracle network: the ecosystem uses it as an oracle for its smart contracts.</p>",n:[],x:""}),tw:()=>{const a=ht("castleNft");return{k:e?"Кольцо туманности · фабрика обликов":"Nebula ring · skin factory",h:"thirdweb",b:e?"<p>Розово-фиолетовое туманное кольцо — thirdweb, наш партнёр по инфраструктуре блокчейна: автоматизация и развёртывание смарт-контрактов.</p><p>Это фабрика обликов: раз в 1–2 месяца из кольца выходит волна новых NFT замков — ограниченный тираж косметики (облик замка, дизайн колоды, иконки). NFT улетают в кошельки игроков; держатели владеют ими у себя в кошельке и сами решают, что с ними делать.</p><p>Castle NFT — это один контракт ERC-1155. Каждая коллекция — отдельный token ID внутри него: 0, 1, 2, 3… — у каждой свой фиксированный лимит. Волна из кольца — выпуск следующего ID.</p>":"<p>The pink-violet nebula ring is thirdweb, our blockchain infrastructure partner: automation and smart contract deployment.</p><p>It is the skin factory: every 1–2 months a wave of new castle NFTs leaves the ring, a limited run of cosmetics (castle skin, deck design, icons). The NFTs fly to player wallets; holders own them in their own wallets and decide what to do with them.</p><p>Castle NFT is one ERC-1155 contract. Each collection is a separate token ID inside it: 0, 1, 2, 3…, each with its own fixed limit. A wave from the ring is the release of the next ID.</p>",n:[[e?"Роль":"Role",e?"инфраструктура и деплой контрактов":"infrastructure and contract deployment"],[e?"Дропы NFT замков":"Castle NFT drops",e?"раз в 1–2 месяца, ограниченный тираж":"every 1–2 months, limited run"],[e?"Контракт NFT замков (ERC-1155)":"Castle NFT contract (ERC-1155)",a?`<a href="${Mo(a)}" target="_blank" rel="noopener">${St(a)} ↗</a>`:l("soon")],[e?"Роялти с перепродаж на внешних площадках":"Royalty on external marketplace resales",bt(v.roy)+" · POL/USDC"]],x:`<p class="note">${e?(g.kind==="sim"?"В симуляции дропы — пример. ":"")+"Кольцо — фон: импульсов и связей на схеме нет, кроме волн дропа.":(g.kind==="sim"?"In the simulation the drops are an example. ":"")+"The ring is a backdrop: no pulses or links on the map apart from drop waves."}</p>`}},tech:()=>({k:e?"Как это устроено":"How it is built",h:e?"Технологии":"Technology",b:`<ul class="tech">${(e?[["Unity","игровой движок; на нём сделана карточная игра Decision Arena"],["Серверы студии","собственные серверы и кластеры Electrum Decisions: матчи, игровая логика, аккаунты"],["Единая база аккаунтов","общая для игры и сайта: один профиль везде"],["thirdweb","встроенные некастодиальные кошельки в игре и фабрика NFT замков"],["Polygon","сеть, в которой работают Amber, матчи, гномы и стейкинг"],["Chainlink","оракулы для смарт-контрактов"],["Аудиты","аудиты смарт-контрактов имеются"]]:[["Unity","the game engine; the Decision Arena card game is built on it"],["Studio servers","Electrum Decisions’ own servers and clusters: matches, game logic, accounts"],["Unified account database","shared by the game and the site: one profile everywhere"],["thirdweb","in-game non-custodial wallets and the castle NFT factory"],["Polygon","the network Amber, matches, gnomes and staking run on"],["Chainlink","oracles for smart contracts"],["Audits","smart contract audits are in place"]]).map(([a,s])=>`<li><b>${a}</b> — ${s}</li>`).join("")}</ul>`,x:""}),gchain:()=>({k:e?"Дорожная карта · в планах":"Roadmap · planned",h:e?"Собственная игровая сеть":"Own game chain",b:e?"<p>По мере роста числа игроков студия рассматривает собственную игровую сеть на технологии Polygon. В такой сети комиссии за транзакции оплачивались бы в Amber.</p><p>Часть игровых данных может публиковаться в блокчейне. У 4X-игры будет публично просматриваемая база данных.</p>":"<p>As the player base grows, the studio is considering its own game network on Polygon technology. In such a network, transaction fees would be paid in Amber.</p><p>Some game data may be published on-chain. The 4X game will have a publicly viewable database.</p>",n:[[e?"Статус":"Status",e?"в планах":"planned"],[e?"Технология":"Technology","Polygon"],[e?"Комиссии сети":"Network fees",e?"в Amber (рассматривается)":"in Amber (under consideration)"]],x:`<p class="note">${e?"Это направление, которое студия рассматривает, а не объявленный запуск: без сроков и обещаний. Янтарная сетка под тканью Polygon видна только в эпохе будущего.":"This is a direction the studio is considering, not an announced launch: no dates and no promises. The amber grid under the Polygon fabric is only visible in the future era."}</p>`}),shield:()=>({k:e?"Эфирный щит экосистемы":"Ether shield of the ecosystem",h:"Shattered Worlds",b:e?"<p>Тонкий эфирный щит — Shattered Worlds, общая экосистема игр студии Electrum Decisions. Он держит всю экосистему вместе: камень Amber, боевой контракт, стейкинг, Банк Студии, гномов, шахту и кошельки игроков.</p><p>Внутри щита — всё, что создаёт и поддерживает студия. Снаружи — чёрная дыра (мёртвый адрес 0x…dEaD), пул ликвидности DEX, внешние площадки и кольцо партнёра thirdweb; кольцо Chainlink проходит через щит.</p>":"<p>The thin ether shield is Shattered Worlds, the shared ecosystem of the Electrum Decisions studio’s games. It holds the whole ecosystem together: the Amber stone, the battle contract, staking, the Studio Bank, the gnomes, the mine and the player wallets.</p><p>Inside the shield is everything the studio builds and runs. Outside are the black hole (the dead address 0x…dEaD), the DEX liquidity pool, the external marketplaces and the thirdweb partner ring; the Chainlink ring passes through the shield.</p>",n:[[e?"Студия":"Studio","Electrum Decisions"],[e?"Игра":"Game","Decision Arena"],[e?"Сеть":"Network","Polygon"]],x:`<p class="note">${e?"Щит — образ студии, а не смарт-контракт. Отдалите камеру до предела — за экосистемой кто-то наблюдает.":"The shield is an image of the studio, not a smart contract. Zoom all the way out: something is watching the ecosystem."}</p>`}),ext:()=>{const a=ht("castleNft");return{k:e?"Вне игры · "+(a?"контракт подключён":"скоро"):"Outside the game · "+(a?"contract connected":"coming soon"),h:l("nExt"),b:e?"<p>Внутриигрового рынка нет и не будет: NFT продают и покупают вне игры, на внешних площадках.</p><p>С перепродаж будущих NFT замков (косметика) студия получает роялти 1% в POL/USDC — площадки перечисляют его автоматически в Банк Студии. Роялти зашито в контракт NFT замков: ровно 1%, изменить его нельзя. Скоро. Это дополнительный доход в криптовалюте сверх модели, поэтому в расчётах модели он не учтён. У гномов роялти {gRoy}.</p>":"<p>There is no in-game market and there never will be: NFTs are bought and sold outside the game, on external marketplaces.</p><p>On resales of the future castle NFTs (cosmetics) the studio gets a 1% royalty in POL/USDC, paid automatically by the marketplaces into the Studio Bank. The royalty is hardcoded in the castle NFT contract: fixed at 1%, it cannot be changed. Coming soon. It is extra crypto income on top of the model, so the model’s numbers leave it out. Gnomes carry a {gRoy} royalty.</p>",n:[[e?"Роялти":"Royalty",bt(v.roy)+" · POL/USDC"],[e?"Размер роялти в контракте":"Royalty rate in the contract",e?"1% · зашито, не меняется":"1% · hardcoded, unchangeable"],[e?"Получатель":"Recipient",l("nBank")],[e?"Контракт NFT замков":"Castle NFT contract",a?`<a href="${Mo(a)}" target="_blank" rel="noopener">${St(a)} ↗</a>`:l("soon")]]}},contract:()=>({k:e?"Камень души · токен в сети Polygon":"The Soul Stone · a token on Polygon",h:l("nContract"),b:e?"<p>Amber — центр всей экономики. Каждый взнос в пул матча, каждая награда, сжигание и майнинг — это движение Amber между кошельками и контрактами вокруг Камня души. Гномы добывают его, а золотой эфир внутри камня — это энергия, которую черпают игроки.</p><p>Новых Amber не выпускается: все 10 млрд уже выпущены. Дальше предложение может только уменьшаться.</p>":"<p>Amber is the centre of the whole economy. Every match pool contribution, reward, burn and mining payout is Amber moving between the wallets and contracts around the Soul Stone. The gnomes mine it, and the golden ether inside the stone is the energy players draw on.</p><p>No new Amber is issued: all 10 bn already exist. From here supply can only go down.</p>",n:[[e?"Общая эмиссия":"Total supply",vt(v.supply)+(e?" (выпущена полностью)":" (fully issued)")],[e?"Сожжено (по модели)":"Burned (per model)",vt(v.burned)],[e?"В обращении":"In circulation",vt(v.circ)],[e?"Резерв майнинга":"Mining reserve",vt(v.reserve)],[e?"Призовой резерв турниров":"Tournament prize reserve",vt(v.prizeRes)],[e?"Матчей на Amber уже сыграно":"Amber matches played so far",w(v.histMatches)],[e?"Взнос в пул матча":"Match pool contribution",w(v.entryMin)+" – "+w(v.entryMax)+" Amber"]],x:Wu()+`<p class="note">${e?"«Сожжено» — по финансовой модели, с учётом первого шага плана. Сколько Amber лежит на мёртвом адресе прямо сейчас, показывает режим «Блокчейн».":"“Burned” is per the financial model, including the first step of the plan. Blockchain mode shows how much Amber sits at the dead address right now."}</p>`}),pool:()=>({k:e?"1 на 1 · боевой контракт":"1v1 · the battle contract",h:l("nPool"),b:e?"<p>Два игрока вносят в пул одинаковую сумму, так что пул всегда равен двум взносам. Пока идёт матч, Amber лежат в боевом контракте, и ни у одной из сторон нет к ним доступа.</p><p>Студия в матче не участвует и против игроков не играет. Она получает фиксированный 1% с пула, кто бы ни победил.</p>":"<p>Two players put the same amount into the pool, so the pool always equals two contributions. While the match runs, the Amber sits in the battle contract and neither side can touch it.</p><p>The studio takes no part in the match and never plays against players. It gets a fixed 1% of the pool whoever wins.</p>",n:[[e?"Победителю":"To the winner",bt(v.win)],[e?"Сжигание":"Burn",bt(v.burn)],[e?"Стейкерам":"To stakers",bt(v.stake)],[e?"Студии (фиксированно)":"Studio (fixed)",bt(v.studio)],[e?"Пример: взносы 2 × 10 000":"Example: contributions 2 × 10,000",(e?"пул ":"pool ")+w(v.exPool)],[e?"Из пула 20 000":"From a 20,000 pool",`${w(v.exWin)} / ${w(v.exBurn)} / ${w(v.exStake)} / ${w(v.exStudio)}`],[e?"Средний взнос в модели":"Average contribution in the model",w(v.avgEntry)+" Amber"]],x:`<p class="note">${e?"Средний взнос — допущение модели по распределению взносов от 10 до 250 000 Amber.":"The average contribution is a model assumption based on a spread from 10 to 250,000 Amber."}</p><p class="note">${e?"Как контракт завершает матч: сервисный кошелёк «Оператор» вызывает endGame, победитель сразу получает 90% пула. Ничья — это endGame с победителем 0x000…0000: каждому полностью возвращается его взнос в пул матча, без сжигания, стейкинга и Банка. Отмена (никто не присоединился) возвращает взнос создателю. Доли 6% / 3% / 1% копятся в контракте и уходят на мёртвый адрес, в стейкинг и в Банк пакетом, когда наберётся 100 Amber. Сервисный сбор 0,01 POL с игрока.":"How the contract finishes a match: the “Operator” service wallet calls endGame and the winner gets 90% of the pool at once. A draw is endGame with winner 0x000…0000: each player’s match pool contribution is refunded in full, with no burn, staking or Bank share. A cancellation (nobody joined) refunds the creator. The 6% / 3% / 1% shares accrue in the contract and go to the dead address, staking and the Bank in one batch once 100 Amber has built up. Service fee 0.01 POL per player."}</p>${typeof Bd=="function"?Bd():""}<div class="btns simOnly"><button onclick="window.__play()">${l("playMatch")}</button></div>`}),burn:()=>({k:e?"Мёртвый адрес · 6% каждого пула":"The dead address · 6% of every pool",h:l("nBurn"),b:e?"<p>6% каждого пула боевой контракт отправляет на мёртвый адрес 0x…dEaD. Это чёрная дыра: ключа к адресу нет ни у кого, и Amber оттуда не возвращаются никогда. Диск растёт и светится ярче с каждым сжиганием. Чёрная дыра — за щитом Shattered Worlds, вне экосистемы.</p><p>Сюда же падает Amber, купленный на 80% от минта гномов. Сколько Amber при этом сгорит, зависит от рынка, поэтому эту часть мы показываем в долларах и в Amber не прогнозируем.</p>":"<p>The battle contract sends 6% of every pool to the dead address 0x…dEaD. This is the black hole: nobody holds a key to it, and Amber never comes back. The disk grows and glows brighter with every burn. The black hole sits outside the Shattered Worlds shield, beyond the ecosystem.</p><p>Amber bought with 80% of the gnome mint falls in here too. How much Amber that burns depends on the market, so we show that part in dollars and do not forecast it in Amber.</p>",n:[[e?"С каждого пула":"From every pool",bt(v.burn)],[e?"Из пула 20 000":"From a 20,000 pool",w(v.exBurn)+" Amber"],[e?"Минт гномов: на выкуп и сжигание":"Gnome mint: buy & burn",Ko(v.mintAvail*v.mintPx*v.mintBurn)],[e?"Новая эмиссия":"New issuance",l("none")],[e?"Адрес":"Address",St(_n)]],x:`<p class="note"><a href="${Mo(q.contracts.dead.address)}" target="_blank" rel="noopener">0x…dEaD · Polygonscan ↗</a></p>`}),staking:()=>({k:e?"LP-стейкинг · награды в Amber":"LP staking · rewards in Amber",h:e?"LP-стейкинг":"LP staking",b:e?"<p>Это LP-стейкинг: в него вносят LP-токены пула QuickSwap WPOL/Amber, а награды начисляются в Amber.</p><p>Каждый бой отправляет 3% пула в пул стейкинга. Эти Amber делятся между теми, кто сейчас в стейкинге, по LP × множитель срока.</p><p>Когда срок заканчивается, LP и накопленные Amber возвращаются автоматически. Награда приходит одним переводом вместе с LP.</p><p>Досрочный выход возвращает только ваши LP, без награды. Эта награда остаётся другим стейкерам.</p>":"<p>This is LP staking: you stake LP tokens of the QuickSwap WPOL/Amber pool, and rewards accrue in Amber.</p><p>Each battle sends 3% of its pool to the staking pool. That Amber is shared among current stakers by LP × the term multiplier.</p><p>At the end of the term, your LP and the accrued Amber are returned automatically. The reward arrives in one transfer together with the LP.</p><p>Early exit returns only your LP, with no reward. That reward stays with the other stakers.</p>",n:[[e?"Что вносят":"What you stake",e?"LP QuickSwap WPOL/Amber":"QuickSwap WPOL/Amber LP"],[e?"Награды":"Rewards",e?"в Amber":"in Amber"],[e?"С каждого боя":"From every battle",bt(v.stake)],[e?"Из пула 20 000":"From a 20,000 pool",w(v.exStake)+" Amber"],[e?"Конец срока":"End of term",e?"LP + Amber, автоматически":"LP + Amber, automatically"],[e?"Досрочный выход":"Early exit",e?"только LP, без награды":"LP only, no reward"]],x:Hu(e)}),bank:()=>({k:e?"Доход студии в Amber":"Studio income in Amber",h:l("nBank"),b:e?"<p>Студия зарабатывает на обороте, а не на исходах матчей. В Банк идёт фиксированный 1% с каждого пула матча и 5% призового пула каждого турнира.</p><p>Студия не играет против игроков, и исход матча на её доход не влияет.</p><p>Сверх модели, в криптовалюте: роялти 1% с перепродаж будущих NFT замков (косметика) на внешних площадках вне игры, в POL/USDC. Площадки перечисляют его автоматически в Банк Студии. Роялти зашито в контракт NFT замков: ровно 1%, изменить его нельзя. Скоро.</p>":"<p>The studio earns on volume, not on match outcomes. The Bank gets a fixed 1% of every match pool and 5% of every tournament prize pool.</p><p>The studio never plays against players, and the result of a match does not change its income.</p><p>On top of the model, in crypto: a 1% royalty from resales of the future castle NFTs (cosmetics) on external marketplaces outside the game, in POL/USDC. The marketplaces pay it automatically into the Studio Bank. The royalty is hardcoded in the castle NFT contract: fixed at 1%, it cannot be changed. Coming soon.</p>",n:[[e?"С пула матча":"From a match pool",bt(v.studio)],[e?"С призового пула турнира":"From a tournament prize pool",bt(v.tBank)],[e?"Пул 20 000":"A 20,000 pool",w(v.exStudio)+" Amber"],[e?"Турнир 1 280 000":"A 1,280,000 tournament",w(v.tPool*v.tBank)+" Amber"],[e?"Роялти с перепродаж NFT замков (внешние площадки)":"Royalty on castle NFT resales (external marketplaces)",bt(v.roy)+" · POL/USDC · "+(ht("castleNft")?e?"контракт подключён":"contract connected":e?"скоро":"coming soon")]]}),tour:()=>({k:e?"Скоро · на выбывание · примерно с "+v.tStart+"-го месяца плана":"Coming soon · single elimination · from about month "+v.tStart,h:l("nTour"),b:e?"<p>Турнир на выбывание: 128 игроков, 7 раундов, в каждом матче один выбывает. Взносы всех участников собираются в призовой пул в контракте турниров, а после финала контракт раздаёт его четырём лучшим и Банку студии.</p>":"<p>A single-elimination tournament: 128 players, 7 rounds, one player drops out of each match. All contributions go into a prize pool in the tournament contract, and after the final it pays out to the top four and the studio’s Bank.</p>",n:[[e?"Игроков в сетке (пример модели)":"Players in the bracket (model example)",w(v.tN)],[e?"Взнос":"Contribution",w(v.tEntry)+" Amber"],[e?"Призовой пул":"Prize pool",w(v.tPool)+" Amber"],[e?"1-е место":"1st place",bt(v.tP[0])+" · "+w(v.tPool*v.tP[0])],[e?"2-е место":"2nd place",bt(v.tP[1])+" · "+w(v.tPool*v.tP[1])],[e?"3-е место":"3rd place",bt(v.tP[2])+" · "+w(v.tPool*v.tP[2])],[e?"4-е место":"4th place",bt(v.tP[3])+" · "+w(v.tPool*v.tP[3])],[e?"Банк Студии Electrum Decisions":"Electrum Decisions Studio Bank",bt(v.tBank)+" · "+w(v.tPool*v.tBank)] ber. The studio earns from ads (rewarded and interstitial) and purchases in the app stores.</p><p>The whole financial model is built on this ring. Token mode sits on top as extra upside and is not part of the valuation.</p>",n:[[e?"Платящих в месяц (базовый)":"Paying users per month (base)",bt(v.payer)+" MAU"],[e?"ARPPU в месяц (базовый)":"ARPPU per month (base)",Ko(v.arppu)],[e?"Rewarded-показов на DAU в день":"Rewarded views per DAU per day",ye(v.rw,1)]],x:`<p class="note">${e?"Базовый сценарий финансовой модели, это допущения.":"Base scenario of the financial model; these are assumptions."}</p>`})}[t]();return ct==="dev"&&ju(t,o,e),o.x=(o.x||"")+qu(t),o}function ju(t,e,n){const o=(r,c)=>{e.b&&(e.b=e.b.split(r).join(c)),e.x&&(e.x=e.x.split(r).join(c))},a=r=>{e.n=(e.n||[]).map(r).filter(Boolean)},s=r=>typeof r=="string"?r.replace(" · POL/USDC",n?" · токены POL/USDC":" · POL/USDC tokens"):r;return(t==="ext"||t==="bank"||t==="tw")&&a(([r,c])=>[r,s(c)]),t==="ext"&&(o("роялти 1% в POL/USDC","роялти 1% в токенах POL/USDC"),o("a 1% royalty in POL/USDC","a 1% royalty in POL/USDC tokens"),o("Это дополнительный доход в криптовалюте сверх модели, поэтому в расчётах модели он не учтён.","Это дополнительные токены сверх модели, поэтому в расчётах модели они не учтены."),o("It is extra crypto income on top of the model, so the model’s numbers leave it out.","These are extra tokens on top of the model, so the model’s numbers leave them out.")),t==="bank"&&(o("Сверх модели, в криптовалюте: роялти","Сверх модели, в токенах: роялти"),o("вне игры, в POL/USDC.","вне игры, в токенах POL/USDC."),o("On top of the model, in crypto: a 1% royalty","On top of the model, in tokens: a 1% royalty"),o("outside the game, in POL/USDC.","outside the game, in POL/USDC tokens.")),t==="burn"&&(o("Сюда же падает Amber, купленный на 80% от минта гномов. Сколько Amber при этом сгорит, зависит от рынка, поэтому эту часть мы показываем в долларах и в Amber не прогнозируем.","Сюда же падает Amber, выкуплен
