.modal h2{margin:0 0 4px;font-size:24px}

.hidden{display:none!important}

 `<p>Всё, что связано с Amber, проходит через один контракт в сети Polygon. Он принимает взносы обоих игроков, держит пул, пока идёт матч, и сам раздаёт результат: победителю, на сжигание, стейкерам и студии. Доли зашиты в код, вручную их никто не меняет.</p><p>Новых Amber не выпускается: все 10 млрд уже выпущены. Дальше предложение может только уменьшаться.</p>`:
 `<p>Everything involving Amber goes through one contract on Polygon. It takes both players’ entries, holds the pool while the match runs and pays out the result itself: winner, burn, stakers and studio. The shares are written into the code; nobody changes them by hand.</p><p>No new Amber is issued: all 10 bn already exist. From here supply can only go down.</p>`,

 `<p>6% каждого пула контракт отправляет на адрес сжигания (0x…dead). Оттуда Amber не возвращаются никогда. Чем больше сыграно матчей, тем меньше Amber остаётся в обращении.</p><p>Сюда же уходит Amber, купленный на 80% от минта гномов. Сколько Amber при этом сгорит, зависит от рынка, поэтому в Amber мы это не прогнозируем.</p>`:
 `<p>The contract sends 6% of every pool to the burn address (0x…dead). Amber never comes back from there. The more matches are played, the less Amber stays in circulation.</p><p>Amber bought with 80% of the gnome mint goes here too. How much Amber that burns depends on the market, so we do not forecast it in Amber.</p>`,

 `<p>3% каждого пула получают те, кто застейкал Amber в LP-стейкинге. Доля зависит от суммы, срока блокировки и того, насколько рано человек вошёл. Чем дольше блокировка, тем выше множитель.</p>`:

 bank:()=>({k:r?'Доход студии в Amber':'Studio income in Amber',h:t('nBank'),b:r?
 `<p>Студия зарабатывает на обороте, а не на проигрышах игроков. В Банк идёт фиксированный 1% с каждого пула матча и 5% призового пула каждого турнира.</p><p>Студия не играет против игроков, и исход матча на её доход не влияет. Отдельно студия получает роялти 1% с перепродаж NFT.</p>`:
 `<p>The studio earns on volume, not on players losing. The Bank gets a fixed 1% of every match pool and 5% of every tournament prize pool.</p><p>The studio never plays against players, and the result of a match does not change its income. Separately, the studio earns a 1% royalty on NFT resales.</p>`,

 `<p>Гномы — коллекция из 9 999 NFT. Застейканный гном майнит Amber, то есть получает их из резерва майнинга. Новые Amber при этом не выпускаются: раздаётся уже существующий резерв.</p><p>Майнинг включается, когда сминчено 7 999 из 9 999 гномов.</p>`:

 else{openCard(h.k);beep(760,.06)}
});
canvas.addEventListener('dblclick',e=>{const h=pick(e.clientX,e.clientY);if(h&&h.k)focusNode(h.k);else if(h&&h.w!=null)walletClick(h.w)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCard();$('play').classList.add('hidden');$('intro').classList.add('hidden')}});

/* ===== i18n apply ===== */
const LEG=[['lWallet','#a78bfa'],['lEntry','#8b5cf6'],['lWin','#f6c75a'],['lBurn','#ff7a3d'],['lStake','#2dd4bf'],['lBank','#f6c75a'],['lTour','#f472b6'],['lMine','#ffb347'],['lMint','#7dd3fc'],['lRoy','#c4b5fd'],['lFiat','#60a5fa']];
function applyI18n(){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i)});
 $('legI').innerHTML=LEG.map(x=>`<div><span class="dot" style="color:${x[1]};background:${x[1]}"></span>${t(x[0])}</div>`).join('');
 for(const k in labEls)labEls[k].textContent=t(LBL[k]);
 $('bLang').textContent=L==='ru'?'EN':'RU';$('iLang').textContent=L==='ru'?'English':'Русский';
 document.title=L==='ru'?'Decision Arena · Electrum Decisions — экономика Amber':'Decision Arena · Electrum Decisions — the Amber economy';
 updBtns();updMintBar();updRanges();
 if(cardKey)openCard(cardKey);
 if(capMode==='fm'&&FM)fmStep(FM.step);else if(capMode==='tour')tourStep(tourI);
 if(!$('play').classList.contains('hidden'))updPlay();
}
function setLang(l){L=l;try{localStorage.setItem('ed_lang',l)}catch(e){}applyI18n()}
function updBtns(){
 $('bPause').textContent=S.paused?t('resume'):t('pause');$('bPause').classList.toggle('on',S.paused);
 $('bSound').textContent=S.sound?t('soundOn'):t('soundOff');$('bSound').classList.toggle('on',S.sound);
 $('bFollow').textContent=FM&&followAuto?t('stopFollow'):t('follow');$('bFollow').classList.toggle('on',!!(FM&&followAuto));
 [['tTok','tok'],['tTour','tourOn'],['tMine','mine'],['tFiat','fiat']].forEach(([id,k])=>$(id).classList.toggle('on',S[k]));
 $('bTourn').classList.toggle('on',TB.running);$('bMint').classList.toggle('on',MS.running);
}

/* ===== Controls ===== */
const sliderToPlayers=v=>{v=+v;const n=v<=50?1000+v/50*14000:15000+(v-50)/50*35000;return Math.round(n/500)*500};
const sliderToSpeed=v=>Math.pow(10,(+v-40)/40);
function updRanges(){$('vP').textContent=fmt(PLAYERS);const s=S.speed;$('vS').textContent=(s<1?fmt2(s,1):s<10?fmt2(s,1):fmt(s))+'×'}
$('rP').oninput=e=>{setPlayers(sliderToPlayers(e.target.value));updRanges()};
$('rS').oninput=e=>{S.speed=sliderToSpeed(e.target.value);updRanges()};
$('bPause').onclick=()=>{S.paused=!S.paused;updBtns()};
$('bPlay').onclick=()=>{hideCapTour();openPlay()};
function hideCapTour(){if(capMode==='tour')hideCap()}
$('bFollow').onclick=()=>{if(FM&&followAuto){endFM()}else{hideCapTour();startFM(sampleEntry(),null,true)}};
$('tTok').onclick=()=>{S.tok=!S.tok;bands.forEach(b=>b.m.uniforms.uO.value=S.tok?.55:.1);updBtns()};
$('tTour').onclick=()=>{S.tourOn=!S.tourOn;updBtns()};
$('tMine').onclick=()=>{S.mine=!S.mine;updBtns();if(S.mine&&!MS.mineOn)toast(t('mineWait'))};
$('tFiat').onclick=()=>{S.fiat=!S.fiat;fiatGroup.visible=S.fiat;updBtns()};
$('bTourn').onclick=()=>{if(!S.tok){S.tok=true;bands.forEach(b=>b.m.uniforms.uO.value=.55);updBtns()}launchTour()};
$('bMint').onclick=()=>{$('mintbar').style.display='block';updMintBar();mint()};
$('bRst').onclick=()=>{S.cM=S.cB=S.cS=S.cK=S.cT=S.cN=0;S.simT=0;WS.pl.fill(0);WS.wn.fill(0);WS.inA.fill(0);WS.outA.fill(0);updStats()};
$('bReset').onclick=()=>{resetView()};
$('bSound').onclick=()=>{S.sound=!S.sound;updBtns();beep(660,.1)};
$('bLang').onclick=()=>setLang(L==='ru'?'en':'ru');
$('iLang').onclick=()=>setLang(L==='ru'?'en':'ru');
$('bTour').onclick=()=>{$('intro').classList.add('hidden');tourStep(0)};
$('bHelp').onclick=()=>$('intro').classList.remove('hidden');
$('iGo').onclick=()=>$('intro').classList.add('hidden');
$('iTour').onclick=()=>{$('intro').classList.add('hidden');tourStep(0)};
$('mtoggle').onclick=()=>{$('ctrl').classList.toggle('min')};
$('stats').onclick=()=>{if(MOBILE)$('stats').classList.toggle('min')};
if(MOBILE)$('bLeg').classList.remove('hidden');
$('bLeg').onclick=()=>$('legend').classList.toggle('show');
if(!MOBILE)$('ctrl').classList.remove('min');
window.__play=()=>{closeCard();openPlay()};window.__tour=()=>{closeCard();launchTour()};window.__mint=()=>{closeCard();$('bMint').onclick()};

/* ===== Stats ===== */
function updStats(){$('sM').textContent=fmt(S.cM);$('sB').textContent=fmt(S.cB);$('sS').textContent=fmt(S.cS);$('sK').textContent=fmt(S.cK);$('sT').textContent=fmt(S.cT);$('sN').textContent=fmt(S.cN);
 const s=S.simT,d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);$('clock').textContent=t('clock',{d,h,m})}

/* ===== Loop ===== */
const clock=new THREE.Clock();let frame=0,fpsAcc=0,fpsN=0,statT=0;window.__fps=0;
function tick(){
 requestAnimationFrame(tick);
 const dt=Math.min(clock.getDelta(),.1);frame++;
 fpsAcc+=dt;fpsN++;if(fpsAcc>1){window.__fps=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0}
 if(!S.paused){
  aClock+=dt;const sd=dt*SIM_SEC*S.speed;S.simT+=sd;
  for(const b of bands)b.spin.rotation.y+=dt*b.w*Math.min(3,.6+.4*S.speed);
  fiatGroup.rotation.y+=dt*.01;
  if(S.tok){S.acc+=PLAYERS/2*MATCH_PER_PLAYER_DAY/86400*sd;let vis=0;const cap=MOBILE?6:14;
   while(S.acc>=1){S.acc--;if(vis<cap&&live()<PN*.7){visMatch();vis++}else numMatch()}}
  updTour(dt);updMint(dt);
  if(FM&&followAuto&&aClock-fmTimer>(FM.step===7?4:2.8)){if(FM.step<7)fmStep(FM.step+1);else startFM(sampleEntry(),null,true)}
 }
 bands.forEach(b=>b.pts.updateMatrixWorld());
 updParticles();
 for(const b of bands)if(b.dirty){b.ha.needsUpdate=true;b.dirty=false}
 /* node animation */
 const tm=performance.now()/1000;
 for(const k in NODES){const n=NODES[k];if(k==='fiat')continue;
  const target=(hoverK===k?1:0)+n.glow;n.glow*=.95;const sc=1+Math.min(.35,target*.18)+(k==='contract'?Math.sin(tm*2)*.03:0);n.inner.scale.setScalar(sc);
  n.inner.traverse(o=>{if(o.name==='spin'){o.rotation.y+=dt*.3;o.rotation.x+=dt*.1}if(o.name==='spin2'){o.rotation.y-=dt*.15}if(o.name==='spinr'){o.rotation.z+=dt*.8;o.rotation.y+=dt*.3}if(o.name==='coin'){o.rotation.z+=dt*1.5}if(o.name==='flame'){o.scale.y=1+Math.sin(tm*9)*.15+n.glow*.4}});
 }
 if(!S.paused)pulse*=.94;const pz=NODES.pool.inner.getObjectByName('pulse');pz.material.opacity=.1+Math.min(.6,pulse*.35);pz.scale.setScalar(1+pulse*.03);
 NODES.gnome.inner.children.forEach(c=>c.material.opacity=1);
 for(const o of flowLines){const want=o.hov?.85:((o.a==='reserve'||o.a==='contract'&&o.b==='reserve')&&!MS.mineOn?.06:o.base);o.ln.material.opacity+=(want-o.ln.material.opacity)*.15}
 if(mouseMoved&&frame%2===0){mouseMoved=false;const h=pick(mx,my);if(h&&h.k){setHover(h.k);hoverW=-1}else{setHover(null);hoverW=h&&h.w!=null?h.w:-1}showTip()}
 updFly();controls.update();
 updLabels();
 if((statT+=dt)>.2){statT=0;updStats()}
 composer.render();
}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
 bloom.resolution.set(innerWidth*(MOBILE?.5:1),innerHeight*(MOBILE?.5:1));const u=uScale();bands.forEach(b=>b.m.uniforms.uS.value=u);PM.uniforms.uS.value=u}
addEventListener('resize',onResize);

/* ===== Boot ===== */
applyI18n();updStats();
const QS=new URLSearchParams(location.search);
if(QS.has('nointro'))$('intro').classList.add('hidden');
window.__ed={openCard,closeCard,nodeScreen,walletScreen:i=>{const q=wPos(i).project(camera);return {x:(q.x*.5+.5)*innerWidth,y:(-q.y*.5+.5)*innerHeight}},
 pick,startFM,fmStep,endFM,launchTour,mint,tourStep,setLang,focusNode,resetView,walletClick,setPlayers,S,M,MS,TB,get FM(){return FM},get cardKey(){return cardKey},PLAYERS:()=>PLAYERS,live,ready:true};
tick();
</script>
</body>
</html>
